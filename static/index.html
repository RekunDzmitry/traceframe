<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Traceframe Hooks</title>
    <link rel="stylesheet" href="/app.css" />
    <script src="/htmx.min.js" defer></script>
  </head>
  <body>
    <main>
      <header class="app-header">
          <h1>Traceframe Context</h1>
          <p class="subtitle">
            What the agent holds in context right now — files, tools, skills.
            Hover any item for the freshness / TTL details.
          </p>
        </div>
        <button class="refresh" type="button" id="refresh">Refresh</button>
      </header>

      <section class="layout">
        <aside class="panel sessions" aria-label="Sessions">
          <div class="section-title">Sessions</div>
          <div class="session-list" id="sessions"></div>
        </aside>

        <section class="panel events" aria-label="Hook events">
          <div class="events-header">
            <div class="events-title-row">
              <div class="events-title" id="events-title">All sessions</div>
              <div class="events-actions">
                <div class="status" id="status">Loading hooks...</div>
                <button class="delete-session" type="button" id="delete-session" hidden>
                  Delete session
                </button>
              </div>
            </div>
            <div class="session-stats" id="session-stats" hidden></div>
          </div>
          <div class="filters" id="filters" hidden>
            <div class="filter">
              <label class="filter-toggle">
                <input type="checkbox" id="filter-failures" />
                Only failures
              </label>
            </div>
            <div class="filter">
              <label for="filter-kind">Kind</label>
              <select id="filter-kind">
                <option value="">All</option>
                <option value="tool">Tool</option>
                <option value="user_prompt">User prompt</option>
                <option value="assistant_stop">Assistant</option>
                <option value="session_start">Session start</option>
                <option value="session_end">Session end</option>
                <option value="notification">Notification</option>
                <option value="permission_request">Permission</option>
                <option value="compact">Compact</option>
              </select>
            </div>
            <div class="filter">
              <label for="filter-tool">Tool</label>
              <select id="filter-tool"><option value="">All</option></select>
            </div>
            <div class="filter">
              <label for="filter-min-dur">Min duration (ms)</label>
              <input type="number" id="filter-min-dur" min="0" step="10" placeholder="0" />
            </div>
            <div class="filter">
              <label for="filter-file">File path contains</label>
              <input type="search" id="filter-file" placeholder="e.g. static/index.html" />
            </div>
            <button class="filter-clear" type="button" id="filter-clear">Clear filters</button>
          </div>
          <ul class="timeline" id="timeline"></ul>
          <div class="empty" id="empty" hidden>No hook events yet.</div>
        </section>
    </main>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" aria-label="Raw payload">
      <div class="drawer-header">
        <div>
          <h2 class="drawer-title" id="drawer-title">Raw payload</h2>
          <div class="drawer-sub" id="drawer-sub"></div>
        </div>
        <button class="btn" type="button" id="drawer-close">Close</button>
      </div>
      <div class="drawer-toolbar">
        <input
          type="search"
          id="drawer-search"
          placeholder="Search keys or values…"
          autocomplete="off"
        />
        <button class="btn primary" type="button" id="drawer-copy">Copy JSON</button>
      </div>
      <div class="drawer-body" id="drawer-body">
        <div class="drawer-empty" id="drawer-empty">Pick a row and click <strong>View raw</strong> to inspect the full payload.</div>
      </div>
    </aside>


    <script>

      const state = {
        hooks: [],
        selectedSession: "all",
        timeline: null,
        rawPayload: new Map(), // event_id -> payload
        expanded: new Set(), // event_ids currently expanded
        expandedGroups: new Set(), // user-message group ids currently expanded
        filters: {
          failures: false,
          kind: "",
          tool: "",
          minDuration: 0,
          file: "",
        },
        searchTerm: "",
        drawerEventId: null,
      };

      const REFRESH_MS = 5000;

      // ---------- DOM helpers ----------

      const $ = (sel) => document.querySelector(sel);
      const $$ = (sel) => Array.from(document.querySelectorAll(sel));

      const sessionsEl = $("#sessions");
      const timelineEl = $("#timeline");
      const statusEl = $("#status");
      const emptyEl = $("#empty");
      const titleEl = $("#events-title");
      const refreshEl = $("#refresh");
      const deleteEl = $("#delete-session");
      const sessionStatsEl = $("#session-stats");
      const filtersEl = $("#filters");
      const scrimEl = $("#scrim");
      const drawerEl = $("#drawer");
      const drawerTitleEl = $("#drawer-title");
      const drawerSubEl = $("#drawer-sub");
      const drawerBodyEl = $("#drawer-body");
      const drawerEmptyEl = $("#drawer-empty");
      const drawerSearchEl = $("#drawer-search");
      const drawerCopyEl = $("#drawer-copy");
      const drawerCloseEl = $("#drawer-close");
      // ---------- Boot ----------

      refreshEl.addEventListener("click", () => loadHooks());
      deleteEl.addEventListener("click", deleteSelectedSession);
      filtersEl.addEventListener("input", onFilterInput);
      filtersEl.addEventListener("change", onFilterInput);
      $("#filter-clear").addEventListener("click", clearFilters);
      drawerCloseEl.addEventListener("click", closeDrawer);
      scrimEl.addEventListener("click", closeDrawer);
      drawerCopyEl.addEventListener("click", copyDrawerJson);
      drawerSearchEl.addEventListener("input", () => {
        state.searchTerm = drawerSearchEl.value.trim();
        renderDrawerBody();
      });

      // ---------- Boot ----------
      loadHooks();
      setInterval(loadHooks, REFRESH_MS);

      // ---------- Self-tests ----------
      //
      // Tiny in-page test runner used by the headless browser smoke test.
      // Results are stashed on `window.__traceframeTests` so the headless
      // runner can scrape them via `page.evaluate`; nothing is injected
      // into the visible DOM. Opt in with ?tests=1.

      function runSelfTests() {
        const url = new URL(window.location.href);
        if (url.searchParams.get("tests") !== "1") return;
        const results = [];
        const t = (name, cond, detail) => {
          results.push(`${cond ? "PASS" : "FAIL"} ${name}${detail ? " — " + detail : ""}`);
        };

        // Issue 7: min-duration filter does not drop prompts/responses.
        const evs = [
          { kind: "user_prompt", duration_ms: 0, event_id: "p1" },
          { kind: "assistant_stop", duration_ms: 0, event_id: "r1" },
          { kind: "tool", tool_name: "Bash", duration_ms: 100, event_id: "t1" },
          { kind: "tool", tool_name: "Bash", duration_ms: 5000, event_id: "t2" },
        ];
        state.filters = { failures: false, kind: "", tool: "", minDuration: 1000, file: "" };
        const out7 = applyFilters(evs);
        t(
          "minDuration keeps prompts and responses",
          out7.some((e) => e.event_id === "p1") && out7.some((e) => e.event_id === "r1"),
          `kept=${out7.map((e) => e.event_id).join(",")}`,
        );
        t(
          "minDuration drops slow-ish tools? no — keeps tools >= 1000ms",
          out7.some((e) => e.event_id === "t2") && !out7.some((e) => e.event_id === "t1"),
          `kept=${out7.map((e) => e.event_id).join(",")}`,
        );

        // Issue 6: stale tool filter value is cleared when the tool is no
        // longer in the list.
        state.filters = { failures: false, kind: "", tool: "NotPresent", minDuration: 0, file: "" };
        populateToolFilter([{ tool_name: "Read" }, { tool_name: "Write" }]);
        t(
          "stale tool filter is cleared",
          state.filters.tool === "" && $("#filter-tool").value === "",
          `tool=${state.filters.tool}, dropdown=${$("#filter-tool").value}`,
        );
        state.filters = { failures: false, kind: "", tool: "Read", minDuration: 0, file: "" };
        populateToolFilter([{ tool_name: "Read" }, { tool_name: "Write" }]);
        t(
          "present tool filter is preserved",
          state.filters.tool === "Read" && $("#filter-tool").value === "Read",
          `tool=${state.filters.tool}, dropdown=${$("#filter-tool").value}`,
        );
        window.__traceframeTests = {
          summary: results.every((r) => r.startsWith("PASS")) ? "ok" : "fail",
          lines: results,
        };
      }

      // Run after a beat so the initial render and filter wiring have settled.
      setTimeout(runSelfTests, 100);

      // ---------- API ----------

      async function loadHooks() {
        statusEl.textContent = "Loading hooks…";
        statusEl.classList.remove("error");
        try {
          const response = await fetch("/api/hooks?limit=300");
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const data = await response.json();
          state.hooks = Array.isArray(data.hooks) ? data.hooks : [];
          invalidateTimelineIfStale();
          render();
          statusEl.textContent = `${state.hooks.length} events`;
        } catch (error) {
          statusEl.textContent = `Failed to load: ${error.message}`;
          statusEl.classList.add("error");
        }
      }

      function invalidateTimelineIfStale() {
        if (!state.timeline) return;
        const id = state.timeline.session?.id;
        if (id && !state.hooks.some((h) => h.session_id === id)) {
          state.timeline = null;
          if (state.selectedSession === id) {
            state.selectedSession = "all";
          }
        }
      }

      async function loadTimeline(sessionId) {
        try {
          const response = await fetch(
            `/api/sessions/${encodeURIComponent(sessionId)}/timeline`,
          );
          if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            throw new Error(body.detail || body.error || `HTTP ${response.status}`);
          }
          return await response.json();
        } catch (error) {
          statusEl.textContent = `Failed to load: ${error.message}`;
          statusEl.classList.add("error");
          return null;
        }
      }async function loadTimeline(sessionId) {
        try {
          const response = await fetch(
            `/api/sessions/${encodeURIComponent(sessionId)}/timeline`,
          );
          if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            throw new Error(body.detail || body.error || `HTTP ${response.status}`);
          }
          return await response.json();
        } catch (error) {
          statusEl.textContent = `Failed to load: ${error.message}`;
          statusEl.classList.add("error");
          return null;
        }
      }

      async function loadRawPayload(eventId) {
        if (state.rawPayload.has(eventId)) {
          return state.rawPayload.get(eventId);
        }
        const response = await fetch(`/api/hooks/${encodeURIComponent(eventId)}`);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const data = await response.json();
        state.rawPayload.set(eventId, data);
        return data;
      }

      // ---------- Render: sessions sidebar ----------

      function render() {
        const sessions = buildSessions(state.hooks);
        if (
          state.selectedSession !== "all" &&
          !sessions.some((session) => session.id === state.selectedSession)
        ) {
          state.selectedSession = "all";
        }
        renderSessions(sessions);
        if (state.selectedSession === "all") {
          state.timeline = null;
          renderAllView(sessions);
          return;
        }
        // For the selected session, only re-render when the timeline object
        // has actually changed. A 5s tick that hits the cached timeline
        // would otherwise tear down every row and pay for a full DOM
        // rebuild + scroll reset for no visible change.
        const cached = state.timeline && state.timeline.session?.id === state.selectedSession;
        if (cached) {
          return;
        }
        ensureTimelineForSelected().then(() => {
          void renderSessionView();
        });
      }

      function buildSessions(hooks) {
        const sessions = new Map();
        for (const hook of hooks) {
          const id = hook.session_id || "unknown";
          const fallbackName = id === "unknown" ? "Unknown session" : id;
          const name = hook.session_name || fallbackName;
          let existing = sessions.get(id);
          if (!existing) {
            existing = {
              id,
              name,
              count: 0,
              tools: 0,
              failures: 0,
              firstEvent: hook.event_time,
              lastEvent: hook.event_time,
            };
            sessions.set(id, existing);
          }
          existing.count += 1;
          if (hook.kind === "tool") existing.tools += 1;
          if (hook.status === "error") existing.failures += 1;
          if (hook.event_time && (!existing.firstEvent || hook.event_time < existing.firstEvent)) {
            existing.firstEvent = hook.event_time;
          }
          if (hook.event_time && hook.event_time > existing.lastEvent) {
            existing.lastEvent = hook.event_time;
          }
        }
        return [...sessions.values()].sort((a, b) =>
          String(b.lastEvent).localeCompare(String(a.lastEvent)),
        );
      }

      function renderSessions(sessions) {
        sessionsEl.textContent = "";
        sessionsEl.appendChild(
          sessionButton({
            id: "all",
            name: "All sessions",
            count: state.hooks.length,
            tools: state.hooks.filter((h) => h.kind === "tool").length,
            failures: state.hooks.filter((h) => h.status === "error").length,
            meta: `${sessions.length} sessions`,
            lastEvent: sessions[0]?.lastEvent,
          }),
        );
        for (const session of sessions) {
          sessionsEl.appendChild(
            sessionButton({
              id: session.id,
              name: session.name,
              count: session.count,
              tools: session.tools,
              failures: session.failures,
              meta: session.lastEvent
                ? `last: ${formatTime(session.lastEvent)}`
                : "no events",
              lastEvent: session.lastEvent,
            }),
          );
        }
      }

      function sessionButton(session) {
        const button = document.createElement("button");
        button.type = "button";
        button.className =
          "session-button" +
          (state.selectedSession === session.id ? " active" : "");
        button.addEventListener("click", () => {
          if (state.selectedSession === session.id) return;
          state.selectedSession = session.id;
          state.expanded.clear();
          state.drawerEventId = null;
          render();
        });

        const label = document.createElement("div");
        const name = document.createElement("div");
        name.className = "session-name";
        name.textContent = session.name;

        const meta = document.createElement("div");
        meta.className = "session-meta";
        const parts = [];
        parts.push(`${session.count} event${session.count === 1 ? "" : "s"}`);
        if (session.tools) parts.push(`${session.tools} tool${session.tools === 1 ? "" : "s"}`);
        if (session.failures) parts.push(`${session.failures} failure${session.failures === 1 ? "" : "s"}`);
        meta.textContent = parts.join(" · ");

        const count = document.createElement("div");
        count.className = "session-count";
        count.textContent = session.count;

        label.append(name, meta);
        button.append(label, count);
        return button;
      }

      // ---------- Render: all-sessions view ----------

      function renderAllView(sessions) {
        titleEl.textContent = "All sessions";
        deleteEl.hidden = true;
        timelineEl.hidden = false;
        sessionStatsEl.hidden = true;
        filtersEl.hidden = state.hooks.length === 0;
        populateToolFilter(state.hooks);
        const filtered = applyFilters(state.hooks);
        renderFlatList(filtered);
      }

      // ---------- Render: single-session view ----------

      async function ensureTimelineForSelected() {
        const id = state.selectedSession;
        if (state.timeline && state.timeline.session?.id === id) return;
        const data = await loadTimeline(id);
        if (data) {
          state.timeline = data;
        }
      }

      async function renderSessionView() {
        const tl = state.timeline;
        if (!tl) {
          timelineEl.textContent = "";
          emptyEl.hidden = false;
          emptyEl.textContent = "Loading session...";
          return;
        }
        const session = tl.session || {};
        titleEl.textContent = session.name || "Session";
        deleteEl.hidden = false;
        timelineEl.hidden = false;
        sessionStatsEl.hidden = false;
        renderSessionStats(session);
        filtersEl.hidden = false;
        const flat = timelineToFlat(tl);
        populateToolFilter(flat);
        const filtered = applyFilters(flat);
        renderTurns(tl, filtered);
      }

      function renderSessionStats(session) {
        sessionStatsEl.textContent = "";
        const stats = [
          { label: "turns", value: session.turn_count || 0 },
          { label: "tools", value: session.tool_count || 0 },
          { label: "events", value: session.event_count || 0 },
          { label: "duration", value: formatDuration(session.duration_ms) },
        ];
        if (session.failure_count) {
          stats.push({ label: "failures", value: session.failure_count, danger: true });
        }
        for (const s of stats) {
          const span = document.createElement("span");
          span.innerHTML = `<strong>${s.value}</strong>${s.label}`;
          if (s.danger) span.style.color = "var(--error)";
          sessionStatsEl.appendChild(span);
        }
      }

      function timelineToFlat(tl) {
        const out = [];
        for (const t of tl.turns || []) {
          if (t.prompt) out.push({ ...t.prompt, _kind: "prompt" });
          for (const tool of t.tools || []) out.push({ ...tool, _kind: "tool" });
          if (t.response) out.push({ ...t.response, _kind: "response" });
        }
        return out;
      }

      /* Agents fire UserPromptSubmit for machine-injected content too —
         background-agent reports, system reminders, the output of `!` shell
         commands. Nobody typed those, so they must not head a group; they
         belong to the message whose work they are part of. Detected by the
         wrapper tag the host prepends. */
      const INJECTED_PROMPT_PREFIXES = [
        "<task-notification>",
        "<system-reminder>",
        "<local-command-caveat>",
        "<command-name>",
        "<command-message>",
        "<bash-input>",
        "<bash-stdout>",
        "<bash-stderr>",
      ];

      /* How long after a prompt a longer re-submission still counts as the
         same message being completed rather than a new one. */
      const SUPERSEDED_PROMPT_WINDOW_MS = 120000;

      function isInjectedPrompt(prompt) {
        if (!prompt) return false;
        const text = (prompt.content || "").trimStart();
        return INJECTED_PROMPT_PREFIXES.some((tag) => text.startsWith(tag));
      }

      /**
       * True when `a` is a fragment that `b` superseded: the user submitted,
       * kept typing, and the host re-sent the whole message. The earlier row
       * is then a strict prefix of the later one, arrived moments before it,
       * and never got far enough to run a tool.
       */
      function supersededBy(a, b) {
        if (!a.prompt || !b.prompt || a.toolCount !== 0) return false;
        const at = a.prompt.content || "";
        const bt = b.prompt.content || "";
        if (!at || at.length >= bt.length || !bt.startsWith(at)) return false;
        const gap = new Date(b.prompt.event_time) - new Date(a.prompt.event_time);
        return gap >= 0 && gap <= SUPERSEDED_PROMPT_WINDOW_MS;
      }

      /**
       * Group the server's turns by the user message that started them.
       *
       * The server flushes a turn on every Stop (main.go), so one prompt that
       * spawns subagents or several stops yields several turns. A turn carries
       * a `prompt` exactly when a UserPromptSubmit opened it, which makes it
       * the group boundary. Turns that arrive before any prompt (the server
       * synthesises a prompt-less turn for those) collect into one leading
       * group.
       *
       * Two kinds of UserPromptSubmit are not new messages and get absorbed
       * into the group before them: injected prompts (see above) and prompts
       * superseded by a longer re-submission.
       *
       * Group ids must stay stable across the 5s refresh, so they are keyed on
       * the prompt's event_id.
       */
      function groupTurnsByUserMessage(turns) {
        const groups = [];
        let current = null;
        for (const t of turns || []) {
          const startsGroup = Boolean(t.prompt) && !isInjectedPrompt(t.prompt);
          if (startsGroup || current === null) {
            current = {
              id: startsGroup ? "ug:" + t.prompt.event_id : "ug:orphan",
              prompt: startsGroup ? t.prompt : null,
              turns: [],
              toolCount: 0,
            };
            groups.push(current);
          }
          current.turns.push(t);
          current.toolCount += (t.tools || []).length;
        }
        // Fold superseded fragments forward into the completed message. Walk
        // backwards so a chain of edits collapses into the final submission.
        for (let i = groups.length - 2; i >= 0; i--) {
          if (!supersededBy(groups[i], groups[i + 1])) continue;
          groups[i + 1].turns = groups[i].turns.concat(groups[i + 1].turns);
          groups[i + 1].toolCount += groups[i].toolCount;
          groups.splice(i, 1);
        }
        return groups;
      }

      /** True when any timeline filter is narrowing the view. */
      function filtersActive() {
        const f = state.filters;
        return Boolean(f.failures || f.kind || f.tool || f.minDuration > 0 || f.file);
      }

      function usermsgHeader(group, isOpen) {
        const header = document.createElement("div");
        header.className = "usermsg-header";
        header.setAttribute("role", "button");
        header.setAttribute("tabindex", "0");
        header.setAttribute("aria-expanded", isOpen ? "true" : "false");

        const chevron = document.createElement("span");
        chevron.className = "usermsg-chevron";
        chevron.textContent = "▶";

        const tag = document.createElement("span");
        tag.className = "tool-tag";
        tag.textContent = "You";

        const title = document.createElement("span");
        title.className = "usermsg-title";
        title.textContent = group.prompt
          ? truncate(firstLine(group.prompt.content), 120) || "(empty prompt)"
          : "Before first prompt";

        const meta = document.createElement("span");
        meta.className = "usermsg-meta";
        const turnCount = group.turns.length;
        meta.textContent =
          `${turnCount} turn${turnCount === 1 ? "" : "s"} · ` +
          `${group.toolCount} tool${group.toolCount === 1 ? "" : "s"} · ` +
          formatTime(group.turns[0].started_at);

        header.append(chevron, tag, title, meta);
        header.addEventListener("click", () => toggleGroup(group.id));
        header.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggleGroup(group.id);
          }
        });
        return header;
      }

      /** Collapse/expand one user-message group in place, no re-render, so the
       *  5s refresh cannot steal the user's scroll position. */
      function toggleGroup(groupId) {
        const groupEl = timelineEl.querySelector(
          `.usermsg[data-group-id="${cssEscape(groupId)}"]`,
        );
        if (!groupEl) return;
        const turnsEl = groupEl.querySelector(".usermsg-turns");
        const header = groupEl.querySelector(".usermsg-header");
        if (!turnsEl || !header) return;
        const willExpand = turnsEl.hidden;
        if (willExpand) state.expandedGroups.add(groupId);
        else state.expandedGroups.delete(groupId);
        turnsEl.hidden = !willExpand;
        groupEl.classList.toggle("expanded", willExpand);
        header.setAttribute("aria-expanded", willExpand ? "true" : "false");
      }

      function renderTurns(tl, filtered) {
        timelineEl.textContent = "";
        const filterIds = new Set(filtered.map((e) => e.event_id));
        const turns = tl.turns || [];
        if (turns.length === 0) {
          emptyEl.hidden = false;
          emptyEl.textContent = "No turns in this session.";
          return;
        }
        emptyEl.hidden = true;

        // Rows that fail a filter are only dimmed, which is invisible inside a
        // collapsed group. So while a filter is active, groups holding a match
        // are forced open. This is a render-time override on top of
        // state.expandedGroups, never a write to it, so clearing the filter
        // restores exactly the groups the user opened by hand.
        const filtering = filtersActive();

        for (const group of groupTurnsByUserMessage(turns)) {
          const groupEl = document.createElement("li");
          groupEl.className = "usermsg";
          groupEl.dataset.groupId = group.id;

          const hasMatch =
            filtering &&
            group.turns.some((t) =>
              (t.tools || []).some((tool) => filterIds.has(tool.event_id)),
            );
          const isOpen = state.expandedGroups.has(group.id) || hasMatch;
          if (isOpen) groupEl.classList.add("expanded");

          groupEl.appendChild(usermsgHeader(group, isOpen));

          const turnsEl = document.createElement("ul");
          turnsEl.className = "usermsg-turns";
          turnsEl.hidden = !isOpen;
          for (const t of group.turns) {
            turnsEl.appendChild(turnElement(t, filterIds));
          }
          groupEl.appendChild(turnsEl);

          timelineEl.appendChild(groupEl);
        }
      }

      /** Render one server turn. Unchanged from before the user-message level
       *  was introduced; it is now nested inside a .usermsg group. */
      function turnElement(t, filterIds) {
        const turnEl = document.createElement("li");
        turnEl.className = "turn";
        const header = document.createElement("div");
        header.className = "turn-header";
        header.innerHTML = `<span class="turn-time">${formatTime(t.started_at)}</span><span>·</span><span>${(t.tools || []).length} tool${(t.tools || []).length === 1 ? "" : "s"}</span>`;
        turnEl.appendChild(header);

        if (t.prompt) {
          const promptEl = document.createElement("div");
          promptEl.className = "turn-prompt";
          const label = document.createElement("div");
          label.className = "turn-prompt-label";
          label.textContent = "You";
          const body = document.createElement("div");
          body.className = "markdown";
          body.innerHTML = renderMarkdown(t.prompt.content || "");
          promptEl.append(label, body);
          turnEl.appendChild(promptEl);
        }

        const toolsEl = document.createElement("ul");
        toolsEl.className = "turn-tools";
        for (const tool of t.tools || []) {
          toolsEl.appendChild(rowForEvent(tool, filterIds.has(tool.event_id)));
          const details = detailsForEvent(tool);
          details.hidden = !state.expanded.has(tool.event_id);
          toolsEl.appendChild(details);
        }
        turnEl.appendChild(toolsEl);

        if (t.response) {
          const respEl = document.createElement("div");
          respEl.className = "turn-response";
          const label = document.createElement("div");
          label.className = "turn-response-label";
          label.textContent = "Assistant";
          const body = document.createElement("div");
          body.className = "markdown";
          body.innerHTML = renderMarkdown(
            t.response.content || "_(response recorded; click View raw for the payload)_",
          );
          respEl.append(label, body);
          turnEl.appendChild(respEl);
        } else {
          const pending = document.createElement("div");
          pending.className = "turn-response";
          pending.innerHTML = `<div class="turn-response-label">Assistant</div><div class="status">No response yet.</div>`;
          turnEl.appendChild(pending);
        }
        return turnEl;
      }

      // ---------- Render: flat list (all sessions) ----------

      function renderFlatList(filtered) {
        timelineEl.textContent = "";
        if (filtered.length === 0) {
          emptyEl.hidden = false;
          emptyEl.textContent = state.hooks.length === 0
            ? "No hook events yet."
            : "No events match the current filters.";
          return;
        }
        emptyEl.hidden = true;
        // Group by session for the "all sessions" view, newest-first.
        const bySession = new Map();
        for (const e of filtered) {
          const id = e.session_id || "unknown";
          if (!bySession.has(id)) bySession.set(id, []);
          bySession.get(id).push(e);
        }
        for (const [id, events] of bySession) {
          const turn = document.createElement("li");
          turn.className = "turn";
          const header = document.createElement("div");
          header.className = "turn-header";
          const name = events[0]?.session_name || id;
          header.innerHTML = `<span>${escapeHtml(name)}</span><span>·</span><span class="turn-time">${formatTime(events[0].event_time)}</span>`;
          turn.appendChild(header);
          const toolsEl = document.createElement("ul");
          toolsEl.className = "turn-tools";
          for (const ev of events) {
            toolsEl.appendChild(rowForEvent(ev, true));
            const details = detailsForEvent(ev);
            details.hidden = !state.expanded.has(ev.event_id);
            toolsEl.appendChild(details);
          }
          turn.appendChild(toolsEl);
          timelineEl.appendChild(turn);
        }
      }

      // ---------- Row + details ----------

      function rowForEvent(ev, passesFilter) {
        const row = document.createElement("li");
        row.className = "row";
        row.dataset.eventId = ev.event_id;
        if (ev.kind === "tool") {
          row.classList.add(ev.status || "ok");
        }
        if (!passesFilter) row.classList.add("dimmed");
        // Restore expanded state on every render so the 5s refresh doesn't
        // collapse rows the user has open.
        const isOpen = state.expanded.has(ev.event_id);
        if (isOpen) row.classList.add("expanded");
        row.setAttribute("aria-expanded", isOpen ? "true" : "false");
        row.setAttribute("role", "button");
        row.setAttribute("tabindex", "0");

        row.addEventListener("click", (e) => {
          if (e.target.closest(".btn")) return;
          toggleExpand(ev.event_id);
        });
        row.addEventListener("keydown", (e) => {
          if (e.target.closest(".btn")) return;
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggleExpand(ev.event_id);
          }
        });

        const icon = document.createElement("span");
        icon.className = "row-icon";
        icon.textContent = iconFor(ev);

        const main = document.createElement("div");
        main.className = "row-main";
        const title = document.createElement("div");
        title.className = "row-title";
        if (ev.kind === "tool" && ev.tool_name) {
          const tag = document.createElement("span");
          tag.className = "tool-tag";
          tag.textContent = ev.tool_name;
          title.appendChild(tag);
        } else if (ev.kind === "user_prompt") {
          const tag = document.createElement("span");
          tag.className = "tool-tag";
          tag.textContent = "You";
          title.appendChild(tag);
        } else if (ev.kind === "assistant_stop") {
          const tag = document.createElement("span");
          tag.className = "tool-tag";
          tag.textContent = "Assistant";
          title.appendChild(tag);
        } else {
          const tag = document.createElement("span");
          tag.className = "tool-tag";
          tag.textContent = humanKind(ev.kind);
          title.appendChild(tag);
        }
        const summaryText = summaryFor(ev);
        title.appendChild(document.createTextNode(summaryText));
        main.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "row-meta";
        const chips = chipsFor(ev);
        for (const chip of chips) {
          const c = document.createElement("span");
          c.className = `chip ${chip.tone || ""}`;
          c.textContent = chip.text;
          meta.appendChild(c);
        }
        if (chips.length) main.appendChild(meta);

        const side = document.createElement("div");
        side.className = "row-side";
        const dur = durationFor(ev);
        if (dur) side.textContent = dur;
        const time = document.createElement("div");
        time.textContent = formatTime(ev.event_time);
        if (dur) {
          side.appendChild(document.createElement("br"));
          side.appendChild(time);
        } else {
          side.textContent = formatTime(ev.event_time);
        }

        row.append(icon, main, side);
        return row;
      }

      function summaryFor(ev) {
        switch (ev.kind) {
          case "tool":
            return ev.summary || (ev.tool_name || "Tool");
          case "user_prompt":
            return ev.content ? truncate(firstLine(ev.content), 160) : "(empty prompt)";
          case "assistant_stop":
            return "response complete";
          case "session_start":
            return "session started";
          case "session_end":
            return "session ended";
          case "notification":
            return ev.content || ev.summary || "notification";
          case "permission_request":
            return ev.tool_name ? `request permission for ${ev.tool_name}` : "permission request";
          case "compact":
            return "compact context";
          default:
            return ev.summary || ev.event_name || "event";
        }
      }

      function chipsFor(ev) {
        const chips = [];
        if (ev.kind === "tool") {
          if (ev.status === "ok") chips.push({ text: "ok", tone: "" });
          if (ev.status === "error") chips.push({ text: `error: ${ev.error || "failed"}`, tone: "error" });
          if (ev.status === "pending") chips.push({ text: "pending", tone: "warning" });
          if (ev.permission_mode) chips.push({ text: ev.permission_mode });
          if (ev.effort) chips.push({ text: `effort: ${ev.effort}` });
        }
        return chips;
      }

      function iconFor(ev) {
        if (ev.kind !== "tool") return "·";
        if (ev.status === "error") return "!";
        if (ev.status === "pending") return "…";
        return "✓";
      }

      function durationFor(ev) {
        if (ev.kind !== "tool") return "";
        if (ev.duration_ms == null) return "";
        if (ev.duration_ms < 1000) return `${ev.duration_ms}ms`;
        return `${(ev.duration_ms / 1000).toFixed(2)}s`;
      }

      function toggleExpand(eventId) {
        if (state.expanded.has(eventId)) state.expanded.delete(eventId);
        else state.expanded.add(eventId);
        // Re-render only the relevant row's details block.
        const row = timelineEl.querySelector(`.row[data-event-id="${cssEscape(eventId)}"]`);
        if (!row) return;
        const next = row.nextElementSibling;
        if (next && next.classList.contains("row-details")) {
          const willExpand = state.expanded.has(eventId);
          next.hidden = !willExpand;
          row.classList.toggle("expanded", willExpand);
          row.setAttribute("aria-expanded", willExpand ? "true" : "false");
        }
      }

      function detailsForEvent(ev) {
        const wrap = document.createElement("div");
        wrap.className = "row-details";
        wrap.dataset.eventId = ev.event_id;

        const grid = document.createElement("div");
        grid.className = "details-grid";

        if (ev.kind === "tool") {
          grid.appendChild(blockInput(ev));
          grid.appendChild(blockOutput(ev));
        } else if (ev.kind === "user_prompt" || ev.kind === "assistant_stop") {
          // Already rendered as markdown in the turn header; show the raw text
          // here for users who want a copy.
          if (ev.content) {
            const block = document.createElement("div");
            block.className = "details-block";
            const h = document.createElement("h4");
            h.textContent = ev.kind === "user_prompt" ? "Prompt" : "Response";
            const body = document.createElement("div");
            body.className = "body";
            const pre = document.createElement("pre");
            pre.style.cssText =
              "background:var(--code-bg);padding:8px 10px;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.45;white-space:pre-wrap;max-height:320px;overflow:auto;margin:0;";
            pre.textContent = ev.content;
            body.appendChild(pre);
            block.append(h, body);
            grid.appendChild(block);
          }
        }

        wrap.appendChild(grid);

        const actions = document.createElement("div");
        actions.className = "details-actions";
        if (ev.status === "error" && ev.error) {
          const pill = document.createElement("span");
          pill.className = "status-pill error";
          pill.textContent = `Error: ${ev.error}`;
          actions.appendChild(pill);
        } else if (ev.status === "pending") {
          const pill = document.createElement("span");
          pill.className = "status-pill pending";
          pill.textContent = "Pending post-event";
          actions.appendChild(pill);
        }
        const grow = document.createElement("span");
        grow.className = "grow";
        actions.appendChild(grow);
        const raw = document.createElement("button");
        raw.className = "btn";
        raw.type = "button";
        raw.textContent = "View raw";
        raw.addEventListener("click", (e) => {
          e.stopPropagation();
          openDrawer(ev.event_id);
        });
        actions.appendChild(raw);
        wrap.appendChild(actions);
        return wrap;
      }

      function blockInput(ev) {
        const block = document.createElement("div");
        block.className = "details-block";
        const h = document.createElement("h4");
        h.textContent = "Input";
        const body = document.createElement("div");
        body.className = "body";
        const dl = document.createElement("dl");
        dl.className = "kv";
        const input = ev.input || {};
        const entries = Object.entries(input);
        if (entries.length === 0) {
          const dd = document.createElement("dd");
          dd.textContent = "_(no input captured)_";
          dl.appendChild(dd);
        } else {
          for (const [key, value] of entries) {
            dt_dd(dl, key, formatValue(value, key));
          }
        }
        body.appendChild(dl);
        block.append(h, body);
        return block;
      }

      function blockOutput(ev) {
        const block = document.createElement("div");
        block.className = "details-block";
        const h = document.createElement("h4");
        h.textContent = "Output";
        const body = document.createElement("div");
        body.className = "body";
        const output = ev.output || {};
        if (output.pending) {
          body.textContent = "Waiting for the PostToolUse event…";
          block.append(h, body);
          return block;
        }
        // Tool-specific rendering.
        if (ev.tool_name === "Edit" || ev.tool_name === "MultiEdit") {
          renderDiff(body, output.structuredPatch);
          block.append(h, body);
          return block;
        }
        if (ev.tool_name === "Bash") {
          renderBash(body, inputCommand(ev), output);
          block.append(h, body);
          return block;
        }
        if (ev.tool_name === "Read") {
          renderRead(body, output);
          block.append(h, body);
          return block;
        }
        const dl = document.createElement("dl");
        dl.className = "kv";
        const entries = Object.entries(output);
        if (entries.length === 0) {
          const dd = document.createElement("dd");
          dd.textContent = "_(no output captured)_";
          dl.appendChild(dd);
        } else {
          for (const [key, value] of entries) {
            dt_dd(dl, key, formatValue(value, key));
          }
        }
        body.appendChild(dl);
        block.append(h, body);
        return block;
      }

      function inputCommand(ev) {
        const input = ev.input || {};
        if (typeof input.command === "string") return input.command;
        if (typeof input.description === "string") return input.description;
        return "";
      }

      function renderBash(body, command, output) {
        if (command) {
          const label = document.createElement("div");
          label.className = "status";
          label.style.marginBottom = "6px";
          label.textContent = "Command";
          const pre = document.createElement("pre");
          pre.className = "stdout-block";
          pre.textContent = command;
          body.append(label, pre);
        }
        if (output.stdout) {
          const label = document.createElement("div");
          label.className = "status";
          label.style.margin = "6px 0 4px";
          label.textContent = "stdout";
          const pre = document.createElement("pre");
          pre.className = "stdout-block";
          pre.textContent = output.stdout;
          body.append(label, pre);
        }
        if (output.stderr) {
          const label = document.createElement("div");
          label.className = "status";
          label.style.margin = "6px 0 4px";
          label.textContent = "stderr";
          const pre = document.createElement("pre");
          pre.className = "stderr-block";
          pre.textContent = output.stderr;
          body.append(label, pre);
        }
        if (output.exitCode != null) {
          const meta = document.createElement("div");
          meta.className = "status";
          meta.style.marginTop = "6px";
          meta.textContent = `exit ${output.exitCode}`;
          body.appendChild(meta);
        }
      }

      function renderRead(body, output) {
        const meta = document.createElement("div");
        meta.className = "status";
        meta.style.marginBottom = "6px";
        const parts = [];
        if (output.filePath) parts.push(output.filePath);
        if (output.startLine != null && output.numLines != null) {
          parts.push(`lines ${output.startLine + 1}–${output.startLine + output.numLines}`);
        }
        meta.textContent = parts.join(" · ");
        body.appendChild(meta);
        if (output.content) {
          const pre = document.createElement("pre");
          pre.className = "stdout-block";
          pre.textContent = output.content;
          body.appendChild(pre);
        }
      }

      function renderDiff(body, structuredPatch) {
        if (!Array.isArray(structuredPatch) || structuredPatch.length === 0) {
          body.textContent = "_(no diff available)_";
          return;
        }
        for (const hunk of structuredPatch) {
          const header = document.createElement("div");
          header.className = "status";
          header.style.margin = "6px 0 2px";
          header.textContent = `@@ -${hunk.oldStart},${hunk.oldLines} +${hunk.newStart},${hunk.newLines} @@`;
          body.appendChild(header);
          const pre = document.createElement("pre");
          pre.className = "stdout-block diff";
          for (const line of hunk.lines || []) {
            const span = document.createElement("span");
            if (line.startsWith("+")) span.className = "diff-line add";
            else if (line.startsWith("-")) span.className = "diff-line remove";
            else span.className = "diff-line context";
            span.textContent = line + "\n";
            pre.appendChild(span);
          }
          body.appendChild(pre);
        }
      }

      function formatValue(value, key) {
        if (value == null) return spanOf("null");
        if (typeof value === "string") {
          if (value.length > 200) {
            const pre = document.createElement("pre");
            pre.textContent = value;
            return pre;
          }
          const span = document.createElement("span");
          span.className = "code-inline";
          span.textContent = JSON.stringify(value);
          return span;
        }
        if (typeof value === "number" || typeof value === "boolean") {
          return spanOf(JSON.stringify(value));
        }
        if (Array.isArray(value)) {
          if (value.length === 0) return spanOf("[]");
          if (value.every((v) => typeof v === "string" || typeof v === "number")) {
            const pre = document.createElement("pre");
            pre.textContent = value.map((v) => `• ${v}`).join("\n");
            return pre;
          }
          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(value, null, 2);
          return pre;
        }
        if (typeof value === "object") {
          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(value, null, 2);
          return pre;
        }
        return spanOf(String(value));
      }

      function spanOf(text) {
        const span = document.createElement("span");
        span.className = "code-inline";
        span.textContent = text;
        return span;
      }

      function dt_dd(dl, key, value) {
        const dt = document.createElement("dt");
        dt.textContent = key;
        const dd = document.createElement("dd");
        if (value instanceof Node) dd.appendChild(value);
        else dd.appendChild(document.createTextNode(String(value)));
        dl.append(dt, dd);
      }

      // ---------- Filters ----------

      function populateToolFilter(events) {
        const select = $("#filter-tool");
        const current = state.filters.tool;
        const tools = new Set();
        for (const ev of events) {
          if (ev.tool_name) tools.add(ev.tool_name);
        }
        const ordered = [...tools].sort();
        select.textContent = "";
        const all = document.createElement("option");
        all.value = "";
        all.textContent = "All";
        select.appendChild(all);
        for (const t of ordered) {
          const opt = document.createElement("option");
          opt.value = t;
          opt.textContent = t;
          select.appendChild(opt);
        }
        // If the previously selected tool is no longer in the list, drop
        // both the dropdown selection and the filter so the view doesn't
        // silently empty out.
        if (current && ordered.includes(current)) {
          select.value = current;
        } else if (current) {
          state.filters.tool = "";
          select.value = "";
        }
      }

      function onFilterInput(e) {
        if (e.target.id === "filter-clear") return;
        state.filters = {
          failures: $("#filter-failures").checked,
          kind: $("#filter-kind").value,
          tool: $("#filter-tool").value,
          minDuration: parseInt($("#filter-min-dur").value, 10) || 0,
          file: $("#filter-file").value.trim().toLowerCase(),
        };
        if (state.selectedSession === "all") {
          renderAllView(buildSessions(state.hooks));
        } else if (state.timeline) {
          void renderSessionView();
        }
      }

      function clearFilters() {
        state.filters = {
          failures: false,
          kind: "",
          tool: "",
          minDuration: 0,
          file: "",
        };
        $("#filter-failures").checked = false;
        $("#filter-kind").value = "";
        $("#filter-tool").value = "";
        $("#filter-min-dur").value = "";
        $("#filter-file").value = "";
        if (state.selectedSession === "all") {
          renderAllView(buildSessions(state.hooks));
        } else if (state.timeline) {
          void renderSessionView();
        }
      }

      function applyFilters(events) {
        return events.filter((ev) => {
          if (state.filters.failures && ev.status !== "error") return false;
          if (state.filters.kind && ev.kind !== state.filters.kind) return false;
          if (state.filters.tool && ev.tool_name !== state.filters.tool) return false;
          // Min duration only applies to tool events. Prompts, responses,
          // and other rows have no duration, so applying the filter
          // would silently drop them.
          if (state.filters.minDuration > 0 && ev.kind === "tool") {
            const d = ev.duration_ms || 0;
            if (d < state.filters.minDuration) return false;
          }
          if (state.filters.file) {
            const input = ev.input || {};
            const file = (input.file_path || ev.output?.filePath || "").toLowerCase();
            if (!file.includes(state.filters.file)) return false;
          }
          return true;
        });
      }

      // ---------- Drawer ----------

      async function openDrawer(eventId) {
        state.drawerEventId = eventId;
        state.searchTerm = "";
        drawerSearchEl.value = "";
        drawerEl.classList.add("open");
        scrimEl.classList.add("open");
        drawerBodyEl.textContent = "";
        drawerEmptyEl.textContent = "Loading…";
        drawerBodyEl.appendChild(drawerEmptyEl);
        try {
          const data = await loadRawPayload(eventId);
          if (state.drawerEventId !== eventId) return; // user moved on
          drawerTitleEl.textContent = data.event_name || "Event";
          drawerSubEl.textContent = `${formatTime(data.event_time)} · session ${data.session_id || "—"}`;
          renderDrawerBody();
        } catch (error) {
          drawerEmptyEl.textContent = `Failed to load: ${error.message}`;
        }
      }

      function closeDrawer() {
        state.drawerEventId = null;
        state.searchTerm = "";
        drawerSearchEl.value = "";
        drawerEl.classList.remove("open");
        scrimEl.classList.remove("open");
      }

      function renderDrawerBody() {
        drawerBodyEl.textContent = "";
        if (!state.drawerEventId) {
          drawerBodyEl.appendChild(drawerEmptyEl);
          return;
        }
        const data = state.rawPayload.get(state.drawerEventId);
        if (!data) {
          drawerBodyEl.appendChild(drawerEmptyEl);
          return;
        }
        const root = renderJson(data.payload || {}, state.searchTerm);
        drawerBodyEl.appendChild(root);
      }

      function renderJson(value, term) {
        return jsonNode(value, term, "$");
      }

      function jsonNode(value, term, path) {
        const wrap = document.createElement("div");
        wrap.className = "json-node";
        if (value === null) {
          wrap.appendChild(jsonRow(path, "null", "json-null", term));
          return wrap;
        }
        if (Array.isArray(value)) {
          const row = jsonRow(path, `Array(${value.length})`, "json-meta", term);
          const toggle = document.createElement("span");
          toggle.className = "json-toggle";
          row.insertBefore(toggle, row.firstChild);
          toggle.addEventListener("click", () => wrap.classList.toggle("collapsed"));
          wrap.appendChild(row);
          const children = document.createElement("div");
          children.className = "json-children";
          wrap.appendChild(children);
          if (value.length === 0) {
            const empty = document.createElement("div");
            empty.className = "json-meta";
            empty.textContent = "(empty)";
            children.appendChild(empty);
          } else {
            value.forEach((v, i) => {
              children.appendChild(jsonNode(v, term, `${path}[${i}]`));
            });
          }
          return wrap;
        }
        if (typeof value === "object") {
          const keys = Object.keys(value);
          const row = jsonRow(path, `Object(${keys.length})`, "json-meta", term);
          const toggle = document.createElement("span");
          toggle.className = "json-toggle";
          row.insertBefore(toggle, row.firstChild);
          toggle.addEventListener("click", () => wrap.classList.toggle("collapsed"));
          wrap.appendChild(row);
          const children = document.createElement("div");
          children.className = "json-children";
          wrap.appendChild(children);
          if (keys.length === 0) {
            const empty = document.createElement("div");
            empty.className = "json-meta";
            empty.textContent = "(empty)";
            children.appendChild(empty);
          } else {
            for (const k of keys) {
              children.appendChild(jsonNode(value[k], term, `${path}.${k}`));
            }
          }
          return wrap;
        }
        // Primitive
        let cls = "json-string";
        if (typeof value === "number") cls = "json-number";
        else if (typeof value === "boolean") cls = "json-boolean";
        wrap.appendChild(jsonRow(path, JSON.stringify(value), cls, term));
        return wrap;
      }

      function jsonRow(path, display, cls, term) {
        const row = document.createElement("div");
        row.className = "json-row";
        const pathEl = document.createElement("span");
        pathEl.className = "json-key";
        pathEl.textContent = path + " ";
        const valEl = document.createElement("span");
        valEl.className = cls;
        if (term) {
          valEl.innerHTML = highlightMatch(display, term);
        } else {
          valEl.textContent = display;
        }
        row.append(pathEl, valEl);
        return row;
      }

      function highlightMatch(text, term) {
        const safe = escapeHtml(text);
        if (!term) return safe;
        const re = new RegExp(escapeRegExp(term), "gi");
        return safe.replace(re, (m) => `<mark>${m}</mark>`);
      }

      async function copyDrawerJson() {
        if (!state.drawerEventId) return;
        const data = state.rawPayload.get(state.drawerEventId);
        if (!data) return;
        try {
          await navigator.clipboard.writeText(JSON.stringify(data.payload, null, 2));
          drawerCopyEl.textContent = "Copied";
          setTimeout(() => (drawerCopyEl.textContent = "Copy JSON"), 1200);
        } catch (error) {
          drawerCopyEl.textContent = "Copy failed";
          setTimeout(() => (drawerCopyEl.textContent = "Copy JSON"), 1200);
        }
      }

      // ---------- Markdown ----------

      function renderMarkdown(input) {
        if (!input) return "";
        // Normalize line endings.
        const text = input.replace(/\r\n/g, "\n");
        // Split into blocks.
        const lines = text.split("\n");
        let html = "";
        let i = 0;
        while (i < lines.length) {
          const line = lines[i];
          if (line.startsWith("```")) {
            const lang = line.slice(3).trim();
            const code = [];
            i++;
            while (i < lines.length && !lines[i].startsWith("```")) {
              code.push(lines[i]);
              i++;
            }
            i++; // skip closing ```
            html += `<pre><code${lang ? ` class="lang-${escapeHtml(lang)}"` : ""}>${escapeHtml(code.join("\n"))}</code></pre>`;
            continue;
          }
          if (/^###\s+/.test(line)) {
            html += `<h3>${renderInline(line.replace(/^###\s+/, ""))}</h3>`;
            i++;
            continue;
          }
          if (/^##\s+/.test(line)) {
            html += `<h2>${renderInline(line.replace(/^##\s+/, ""))}</h2>`;
            i++;
            continue;
          }
          if (/^#\s+/.test(line)) {
            html += `<h1>${renderInline(line.replace(/^#\s+/, ""))}</h1>`;
            i++;
            continue;
          }
          if (/^[-*]\s+/.test(line)) {
            const items = [];
            while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
              items.push(renderInline(lines[i].replace(/^[-*]\s+/, "")));
              i++;
            }
            html += `<ul>${items.map((it) => `<li>${it}</li>`).join("")}</ul>`;
            continue;
          }
          if (/^\d+\.\s+/.test(line)) {
            const items = [];
            while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
              items.push(renderInline(lines[i].replace(/^\d+\.\s+/, "")));
              i++;
            }
            html += `<ol>${items.map((it) => `<li>${it}</li>`).join("")}</ol>`;
            continue;
          }
          if (line.trim() === "") {
            i++;
            continue;
          }
          // Paragraph: gather consecutive non-blank, non-block lines.
          const para = [];
          while (
            i < lines.length &&
            lines[i].trim() !== "" &&
            !/^#{1,3}\s/.test(lines[i]) &&
            !/^```/.test(lines[i]) &&
            !/^[-*]\s+/.test(lines[i]) &&
            !/^\d+\.\s+/.test(lines[i])
          ) {
            para.push(lines[i]);
            i++;
          }
          if (para.length) {
            html += `<p>${renderInline(para.join(" "))}</p>`;
          }
        }
        return html;
      }

      function renderInline(text) {
        let s = escapeHtml(text);
        s = s.replace(/`([^`]+)`/g, (_, code) => `<code>${code}</code>`);
        s = s.replace(/\*\*([^*]+)\*\*/g, (_, b) => `<strong>${b}</strong>`);
        s = s.replace(/(^|\W)\*([^*]+)\*(?=\W|$)/g, (_, pre, em) => `${pre}<em>${em}</em>`);
        s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noreferrer">${t}</a>`);
        return s;
      }

      // ---------- Misc ----------

      async function deleteSelectedSession() {
        if (state.selectedSession === "all") return;
        const sessionId = state.selectedSession;
        const session = buildSessions(state.hooks).find((s) => s.id === sessionId);
        if (!session) return;
        const confirmed = window.confirm(
          `Delete ${session.name} and all ${session.count} event${
            session.count === 1 ? "" : "s"
          }? This cannot be undone.`,
        );
        if (!confirmed) return;
        deleteEl.disabled = true;
        statusEl.textContent = "Deleting session…";
        try {
          const response = await fetch(
            `/api/sessions/${encodeURIComponent(sessionId)}`,
            { method: "DELETE" },
          );
          if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            throw new Error(body.detail || body.error || `HTTP ${response.status}`);
          }
          state.timeline = null;
          state.selectedSession = "all";
          state.expanded.clear();
          await loadHooks();
        } catch (error) {
          statusEl.textContent = `Delete failed: ${error.message}`;
        } finally {
          deleteEl.disabled = false;
        }
      }

      function formatTime(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return new Intl.DateTimeFormat(undefined, {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        }).format(date);
      }

      function formatDuration(ms) {
        if (!ms || ms < 0) return "—";
        if (ms < 1000) return `${ms}ms`;
        const s = ms / 1000;
        if (s < 60) return `${s.toFixed(1)}s`;
        const m = Math.floor(s / 60);
        const rs = Math.floor(s % 60);
        return `${m}m ${rs}s`;
      }

      function firstLine(s) {
        if (!s) return "";
        const i = s.indexOf("\n");
        return i >= 0 ? s.slice(0, i) : s;
      }

      function truncate(s, n) {
        if (!s) return "";
        return s.length > n ? s.slice(0, n) + "…" : s;
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function escapeRegExp(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function humanKind(kind) {
        if (!kind) return "event";
        return kind.replace(/_/g, " ");
      }

      function cssEscape(value) {
        if (window.CSS && CSS.escape) return CSS.escape(value);
        return value.replace(/([!"#$%&'()*+,./:;<=>?@\[\\\]^`{|}~])/g, "\\$1");
      }
    </script>
  </body>
