<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>traceframe · memory admin</title>
<style>
  :root {
    --bg: #fafaf9; --surface: #f5f5f4; --surface-2: #ececeb;
    --border: #e7e5e4; --border-strong: #d6d3d1;
    --ink: #1c1917; --muted: #78716c; --muted-2: #a8a29e;
    --accent-green: oklch(0.72 0.14 145); --accent-green-soft: oklch(0.92 0.06 145);
    --accent-amber: oklch(0.72 0.14 75);
    --accent-red: oklch(0.65 0.14 25); --accent-red-soft: oklch(0.94 0.05 25);
    --accent-blue: oklch(0.62 0.12 240); --accent-blue-soft: oklch(0.94 0.04 240);
    --font: "Inter", -apple-system, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
    --radius: 4px; --radius-sm: 3px;
    --shadow-1: 0 1px 2px rgba(28,25,23,0.04); --shadow-2: 0 2px 8px rgba(28,25,23,0.08);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  .mono { font-family: var(--font-mono); font-size: 12px; }
  .muted { color: var(--muted); }
  a { color: var(--accent-blue); }

  .app { display: grid; grid-template-rows: 46px 1fr; height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .brand { font-weight: 600; letter-spacing: -0.01em; }
  .brand b { color: var(--accent-green); }
  .tabs { display: flex; gap: 4px; margin-left: 8px; }
  .tab { padding: 5px 12px; border: 1px solid transparent; border-radius: var(--radius); cursor: pointer; color: var(--muted); }
  .tab.active { background: var(--bg); border-color: var(--border); color: var(--ink); font-weight: 500; }
  .spacer { flex: 1; }
  .keyfield { display: flex; align-items: center; gap: 6px; }
  .keyfield input { width: 180px; padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-2); }
  .dot.ok { background: var(--accent-green); }
  .dot.bad { background: var(--accent-red); }

  .view { display: none; height: 100%; overflow: hidden; }
  .view.active { display: block; }

  /* Memories */
  .mem-grid { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
  .sidebar { border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; background: var(--surface); }
  .main { overflow-y: auto; padding: 18px 22px; }
  .search-box { display: flex; gap: 6px; margin-bottom: 12px; }
  .search-box input { flex: 1; padding: 6px 9px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted-2); margin: 14px 0 6px; }
  .proj { display: flex; justify-content: space-between; padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; }
  .proj:hover { background: var(--surface-2); }
  .proj.active { background: var(--accent-blue-soft); }
  .proj .count { color: var(--muted); font-size: 11px; }
  .mem-item { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; cursor: pointer; background: var(--bg); }
  .mem-item:hover { border-color: var(--border-strong); box-shadow: var(--shadow-1); }
  .mem-item .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mem-item .meta { display: flex; gap: 8px; color: var(--muted); font-size: 11px; margin-top: 3px; }
  .score { color: var(--accent-green); font-weight: 600; }
  pre.summary { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-family: var(--font-mono); font-size: 12px; }
  textarea { width: 100%; min-height: 160px; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); font-family: var(--font-mono); font-size: 12px; resize: vertical; }
  .btn { padding: 5px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent-green-soft); border-color: var(--accent-green); }
  .btn.danger { background: var(--accent-red-soft); border-color: var(--accent-red); }
  .row { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted-2); margin-bottom: 4px; display: block; }
  input.text { padding: 6px 9px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); }
  h2 { font-size: 15px; margin: 0 0 4px; }
  .empty { color: var(--muted-2); text-align: center; margin-top: 80px; }

  /* Optimizer */
  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: 100%; }
  .opt-input, .opt-output { overflow-y: auto; padding: 18px 22px; }
  .opt-input { border-right: 1px solid var(--border); background: var(--surface); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
  .stat { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; background: var(--bg); }
  .stat .n { font-size: 20px; font-weight: 600; }
  .stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; background: var(--accent-green); }
  .layer { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; background: var(--bg); }
  .layer h4 { margin: 0 0 4px; font-size: 12px; }
  .issue { padding: 4px 0; border-bottom: 1px dashed var(--border); font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand">trace<b>frame</b> · memory</span>
    <div class="tabs">
      <div class="tab active" data-view="memories">Memories</div>
      <div class="tab" data-view="optimizer">Optimizer</div>
    </div>
    <div class="spacer"></div>
    <div class="keyfield">
      <span class="dot" id="health-dot" title="health"></span>
      <input id="apikey" type="password" placeholder="API key (Bearer)" />
    </div>
  </div>

  <!-- MEMORIES -->
  <div class="view active" id="view-memories">
    <div class="mem-grid">
      <aside class="sidebar">
        <div class="search-box">
          <input id="search-input" placeholder="Semantic search…" />
          <button class="btn" id="search-btn">Go</button>
        </div>
        <div class="section-label">Projects</div>
        <div id="projects"></div>
        <div class="section-label">New memory</div>
        <input class="text" id="new-repo" placeholder="repo_tag" style="width:100%;margin-bottom:6px" />
        <textarea id="new-summary" placeholder="summary…" style="min-height:90px"></textarea>
        <button class="btn primary" id="new-btn" style="margin-top:6px;width:100%">Add memory</button>
      </aside>
      <main class="main" id="mem-main">
        <div class="empty">Select a project or search to browse memories.</div>
      </main>
    </div>
  </div>

  <!-- OPTIMIZER -->
  <div class="view" id="view-optimizer">
    <div class="opt-grid">
      <div class="opt-input">
        <h2>Prompt optimizer</h2>
        <p class="muted">Paste a prompt, pick a profile, and see token savings.</p>
        <label class="field-label">Profile</label>
        <select id="opt-profile" class="text">
          <option value="balanced">balanced</option>
          <option value="max-save">max-save</option>
          <option value="quality-first">quality-first</option>
        </select>
        <label class="field-label" style="margin-top:12px">System prompt</label>
        <textarea id="opt-system" placeholder="You are a helpful assistant…"></textarea>
        <label class="field-label" style="margin-top:12px">Messages (JSON array)</label>
        <textarea id="opt-messages" placeholder='[{"role":"user","content":"…"}]'></textarea>
        <label class="field-label" style="margin-top:12px">Tools (JSON array, optional)</label>
        <textarea id="opt-tools" placeholder='[{"name":"read","description":"…"}]' style="min-height:80px"></textarea>
        <div class="row">
          <button class="btn primary" id="opt-pipeline">Run pipeline</button>
          <button class="btn" id="opt-analyze">Analyze only</button>
        </div>
      </div>
      <div class="opt-output" id="opt-output">
        <div class="empty">Run the optimizer to see results.</div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// ── auth + fetch ──
const keyInput = $("apikey");
keyInput.value = localStorage.getItem("tf_key") || "";
keyInput.addEventListener("change", () => { localStorage.setItem("tf_key", keyInput.value); checkHealth(); });

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (keyInput.value) headers["authorization"] = "Bearer " + keyInput.value;
  if (opts.body) headers["content-type"] = "application/json";
  const res = await fetch(path, { ...opts, headers });
  if (!res.ok) {
    let msg = res.status + "";
    try { msg = (await res.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  return res.json();
}

async function checkHealth() {
  const dot = $("health-dot");
  try {
    const h = await fetch("/healthz").then((r) => r.json());
    dot.className = "dot " + (h.ok ? "ok" : "bad");
    dot.title = "db: " + h.db;
  } catch { dot.className = "dot bad"; }
}

// ── tabs ──
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
  document.querySelectorAll(".view").forEach((x) => x.classList.remove("active"));
  t.classList.add("active");
  $("view-" + t.dataset.view).classList.add("active");
}));

// ── memories ──
let activeRepo = null;

async function loadProjects() {
  try {
    const { projects } = await api("/api/projects");
    $("projects").innerHTML = projects.length
      ? projects.map((p) => `<div class="proj" data-repo="${esc(p.repoTag)}"><span>${esc(p.repoTag)}</span><span class="count">${p.memoryCount}</span></div>`).join("")
      : '<div class="muted">no memories yet</div>';
    document.querySelectorAll(".proj").forEach((el) => el.addEventListener("click", () => selectRepo(el.dataset.repo)));
  } catch (e) { $("projects").innerHTML = `<div class="muted">⚠ ${esc(e.message)}</div>`; }
}

async function selectRepo(repo) {
  activeRepo = repo;
  document.querySelectorAll(".proj").forEach((el) => el.classList.toggle("active", el.dataset.repo === repo));
  const { memories } = await api("/api/memories?limit=50&repo=" + encodeURIComponent(repo));
  renderList(memories, `${repo} · ${memories.length} memories`);
}

function renderList(memories, heading, scored) {
  if (!memories.length) { $("mem-main").innerHTML = `<div class="empty">No memories.</div>`; return; }
  $("mem-main").innerHTML = `<h2>${esc(heading)}</h2>` + memories.map((m) => {
    const first = (m.summary.split("\n").find((l) => l.trim() && !l.startsWith("#")) || m.summary).slice(0, 90);
    return `<div class="mem-item" data-id="${m.id}">
      <div class="title">${esc(first)}</div>
      <div class="meta"><span class="mono">#${m.id}</span><span>${esc(m.repoTag)}</span>
      ${scored ? `<span class="score">${(m.score * 100).toFixed(0)}%</span>` : ""}
      <span>${new Date(m.createdAt).toLocaleDateString()}</span></div>
    </div>`;
  }).join("");
  document.querySelectorAll(".mem-item").forEach((el) => el.addEventListener("click", () => openMemory(el.dataset.id)));
}

async function openMemory(id) {
  const { memory: m } = await api("/api/memories/" + id);
  $("mem-main").innerHTML = `
    <div class="row"><h2 style="margin:0">Memory #${m.id}</h2><span class="spacer"></span>
      <button class="btn" id="edit-btn">Edit</button>
      <button class="btn danger" id="del-btn">Delete</button></div>
    <div class="meta muted mono">${esc(m.repoTag)} · ${esc(m.kind)} · ${new Date(m.createdAt).toLocaleString()}</div>
    <pre class="summary" id="sum">${esc(m.summary)}</pre>`;
  $("edit-btn").addEventListener("click", () => editMemory(m));
  $("del-btn").addEventListener("click", () => delMemory(m.id));
}

function editMemory(m) {
  $("sum").outerHTML = `<textarea id="edit-area">${esc(m.summary)}</textarea>
    <div class="row"><button class="btn primary" id="save-btn">Save</button></div>`;
  $("save-btn").addEventListener("click", async () => {
    await api("/api/memories/" + m.id, { method: "PATCH", body: JSON.stringify({ summary: $("edit-area").value }) });
    openMemory(m.id);
  });
}

async function delMemory(id) {
  if (!confirm("Delete memory #" + id + "?")) return;
  await api("/api/memories/" + id, { method: "DELETE" });
  $("mem-main").innerHTML = `<div class="empty">Deleted #${id}.</div>`;
  loadProjects();
}

async function runSearch() {
  const q = $("search-input").value.trim();
  if (!q) return;
  try {
    const { results } = await api("/api/search", { method: "POST", body: JSON.stringify({ query: q, max_results: 10 }) });
    renderList(results, `Search · “${q}”`, true);
  } catch (e) { $("mem-main").innerHTML = `<div class="empty">⚠ ${esc(e.message)}</div>`; }
}
$("search-btn").addEventListener("click", runSearch);
$("search-input").addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });

$("new-btn").addEventListener("click", async () => {
  const repo_tag = $("new-repo").value.trim(), summary = $("new-summary").value.trim();
  if (!repo_tag || !summary) { alert("repo_tag and summary required"); return; }
  try {
    await api("/api/memories", { method: "POST", body: JSON.stringify({ repo_tag, summary }) });
    $("new-summary").value = "";
    await loadProjects();
    selectRepo(repo_tag);
  } catch (e) { alert("Failed: " + e.message); }
});

// ── optimizer ──
function parseArr(id) {
  const v = $(id).value.trim();
  if (!v) return [];
  try { return JSON.parse(v); } catch { throw new Error(`${id} is not valid JSON`); }
}

function pct(n) { return (n || 0).toFixed(0) + "%"; }

function renderOptimizer(report, optimized) {
  const r = report;
  // Normalize across analyze ({totalTokens,potentialSaving,potentialSavingPct})
  // and pipeline report ({inputTokens,savedTokens,savedPct}).
  const orig = r.totalTokens ?? r.inputTokens ?? "—";
  const saved = r.potentialSaving ?? r.savedTokens ?? "—";
  const savedPct = r.potentialSavingPct ?? r.savedPct ?? 0;

  let html = `<h2>Result</h2>
    <div class="stat-grid">
      <div class="stat"><div class="n">${orig}</div><div class="l">tokens (orig)</div></div>
      <div class="stat"><div class="n">${saved}</div><div class="l">tokens saved</div></div>
      <div class="stat"><div class="n">${pct(savedPct)}</div><div class="l">reduction</div></div>
    </div>
    <div class="bar"><span style="width:${Math.min(100, savedPct)}%"></span></div>`;

  if (r.breakdown) {
    html += `<div class="section-label">Token breakdown</div>`;
    for (const [k, v] of Object.entries(r.breakdown)) html += `<div class="issue">${esc(k)}: <b>${esc(v)}</b> tok</div>`;
  }
  if (r.issues && r.issues.length) {
    html += `<div class="section-label">Issues</div>`;
    html += r.issues.map((i) => `<div class="issue"><b>${esc(i.type)}</b> · ${esc(i.description || "")} <span class="muted">(~${i.tokens} tok)</span></div>`).join("");
  }
  if (optimized && optimized.report && optimized.report.layers) {
    html += `<div class="section-label">Pipeline layers</div>`;
    for (const [name, data] of Object.entries(optimized.report.layers)) {
      html += `<div class="layer"><h4>${esc(name)}</h4><div class="mono muted">${esc(JSON.stringify(data))}</div></div>`;
    }
  }
  $("opt-output").innerHTML = html;
}

async function runOptimizer(endpoint) {
  try {
    const payload = {
      system: $("opt-system").value,
      messages: parseArr("opt-messages"),
      tools: parseArr("opt-tools"),
      profile: $("opt-profile").value,
    };
    const out = await api("/api/optimizer/" + endpoint, { method: "POST", body: JSON.stringify(payload) });
    renderOptimizer(out.report || out, out.report ? out : null);
  } catch (e) { $("opt-output").innerHTML = `<div class="empty">⚠ ${esc(e.message)}</div>`; }
}
$("opt-pipeline").addEventListener("click", () => runOptimizer("pipeline"));
$("opt-analyze").addEventListener("click", () => runOptimizer("analyze"));

// ── init ──
checkHealth();
loadProjects();
</script>
</body>
</html>
