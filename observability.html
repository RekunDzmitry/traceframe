<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>traceframe</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>:root {
  --bg: #fafaf9;
  --surface: #f5f5f4;
  --surface-2: #ececeb;
  --border: #e7e5e4;
  --border-strong: #d6d3d1;
  --ink: #1c1917;
  --muted: #78716c;
  --muted-2: #a8a29e;
  --accent-green: oklch(0.72 0.14 145);
  --accent-green-soft: oklch(0.92 0.06 145);
  --accent-amber: oklch(0.72 0.14 75);
  --accent-amber-soft: oklch(0.94 0.07 75);
  --accent-red: oklch(0.65 0.14 25);
  --accent-red-soft: oklch(0.94 0.05 25);
  --font: "Inter", -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  --radius: 4px;
  --radius-sm: 3px;
  --shadow-1: 0 1px 2px rgba(28,25,23,0.04);
  --shadow-2: 0 2px 8px rgba(28,25,23,0.08);
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: -0.01em; }
.muted { color: var(--muted); }

/* ───────── App shell ───────── */
.app {
  display: grid;
  grid-template-rows: 44px 1fr;
  height: 100vh;
  background: var(--bg);
}
.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  font-size: 12px;
}
.brand {
  display: flex; align-items: center; gap: 8px;
  font-weight: 600; font-family: var(--font-mono); letter-spacing: -0.02em;
}
.brand-glyph {
  width: 18px; height: 18px; border-radius: 3px;
  background: var(--ink);
  display: grid; place-items: center;
  color: var(--bg); font-size: 11px;
}
.divider-v { width: 1px; height: 20px; background: var(--border); }
.top-filters { display: flex; align-items: center; gap: 6px; flex: 1; }
.top-filters .chip { font-size: 11px; }
.top-right { display: flex; align-items: center; gap: 8px; }

/* ───────── Layout ───────── */
.workspace {
  display: grid;
  grid-template-columns: 240px 1fr;
  overflow: hidden;
  height: 100%;
}
.sidebar {
  border-right: 1px solid var(--border);
  background: var(--surface);
  overflow-y: auto;
  padding: 8px 0;
}
.sidebar-section { padding: 8px 12px; }
.sidebar-section-label {
  font-size: 10.5px;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 6px;
  display: flex; align-items: center; justify-content: space-between;
}
.trace-item {
  padding: 6px 12px; cursor: pointer;
  border-left: 2px solid transparent;
  display: grid; gap: 2px;
  font-size: 12px;
}
.trace-item:hover { background: var(--surface-2); }
.trace-item.is-active {
  background: var(--surface-2);
  border-left-color: var(--accent-green);
}
.trace-title { font-weight: 500; }
.trace-meta {
  font-family: var(--font-mono); font-size: 10.5px; color: var(--muted);
  display: flex; gap: 8px;
}
.trace-status { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.trace-status.running { background: var(--accent-green); animation: pulse 1.6s infinite; }
.trace-status.done { background: var(--muted-2); }
.trace-status.failed { background: var(--accent-red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.main-area {
  display: grid;
  grid-template-columns: 1fr;
  overflow: hidden;
}
.main-area.with-branch {
  grid-template-columns: 1.4fr 1fr 1fr;
}
.main-area.no-branch {
  grid-template-columns: 1.4fr 1fr;
}

/* ───────── Panels ───────── */
.tree-panel, .detail-panel, .branch-panel {
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
  overflow: hidden;
  min-width: 0;
}
.branch-panel { border-right: none; background: var(--surface); }
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  min-height: 40px;
  flex-shrink: 0;
}
.panel-title { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 12px; }
.panel-actions { display: flex; align-items: center; gap: 4px; }
.dot { width: 7px; height: 7px; border-radius: 50%; }
.dot-running { background: var(--accent-green); animation: pulse 1.6s infinite; }
.branch-dot { width: 8px; height: 8px; background: var(--accent-amber); border-radius: 50%; }

/* ───────── Chips / buttons ───────── */
.chip {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 2px 8px;
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--muted);
  cursor: pointer;
}
.chip:hover { background: var(--surface-2); color: var(--ink); }
.chip-on {
  background: var(--ink); color: var(--bg); border-color: var(--ink);
}
.chip-mini {
  background: transparent; border: 1px dashed var(--border-strong);
  padding: 2px 7px; font-size: 10.5px; font-family: var(--font-mono);
  color: var(--muted); cursor: pointer; border-radius: 3px;
}
.chip-mini:hover { color: var(--ink); border-color: var(--muted); }
.icon-btn, .icon-btn-sm {
  background: transparent; border: 1px solid transparent;
  padding: 2px 6px; cursor: pointer; color: var(--muted);
  font-family: var(--font-mono); border-radius: 3px;
}
.icon-btn:hover, .icon-btn-sm:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn-sm { font-size: 11px; padding: 0 4px; }

.btn {
  padding: 5px 11px; border-radius: 3px; cursor: pointer;
  font-size: 11.5px; font-weight: 500; border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--ink);
}
.btn:hover { background: var(--surface-2); }
.btn-primary {
  background: var(--ink); color: var(--bg); border-color: var(--ink);
}
.btn-primary:hover { background: #000; }
.btn-primary.is-active { background: var(--accent-amber); border-color: var(--accent-amber); color: #1c1917; }
.btn-ghost { background: transparent; border-color: var(--border); color: var(--muted); }

/* ───────── Tree ───────── */
.tree-body {
  flex: 1; overflow: auto;
  background:
    radial-gradient(circle at 1px 1px, var(--border) 0.6px, transparent 0.7px) 0 0 / 14px 14px,
    var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
}
.tree-body > * { margin: auto; }
.node-glyph circle { transition: filter 0.15s; }
.node-glyph:hover circle { filter: brightness(0.97); }
.tree-legend {
  display: flex; gap: 14px; flex-wrap: wrap;
  padding: 6px 12px; border-top: 1px solid var(--border);
  font-size: 10.5px; color: var(--muted); font-family: var(--font-mono);
  background: var(--surface);
}
.tree-legend span { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.swatch-ink { background: var(--ink); }
.swatch-green { background: var(--accent-green); }
.swatch-green-out { background: var(--surface); border: 1px dashed var(--accent-green); box-sizing: border-box; }
.swatch-amber { background: var(--accent-amber); }

/* ───────── Node detail ───────── */
.breadcrumb { display: flex; gap: 6px; font-size: 12px; align-items: center; }
.crumb { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.crumb-active { color: var(--ink); font-weight: 500; }
.crumb-sep { color: var(--border-strong); }
.node-summary {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  padding: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.node-summary-main { display: grid; gap: 4px; align-content: start; }
.node-id { font-size: 10.5px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
.node-label { font-size: 14px; font-weight: 500; line-height: 1.35; }
.node-stats {
  display: grid;
  grid-template-columns: repeat(3, auto);
  gap: 3px 16px;
  font-size: 11px;
}
.kv { display: grid; grid-template-columns: minmax(60px, auto) 1fr; gap: 8px; align-items: baseline; }
.kv-k { color: var(--muted); font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; }
.kv-v { font-size: 12px; }
.kv-v.mono { font-family: var(--font-mono); }

.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  padding: 0 12px;
  gap: 0;
  flex-shrink: 0;
}
.tab {
  background: transparent; border: none; cursor: pointer;
  padding: 8px 12px; font-size: 12px;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab-active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }

.tab-body {
  flex: 1; overflow: auto;
  padding: 12px;
}

/* ───────── Decision ───────── */
.subtabs {
  display: flex; gap: 4px;
  margin-bottom: 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 3px; padding: 2px; width: fit-content;
}
.subtab {
  background: transparent; border: none;
  padding: 4px 10px; font-size: 11.5px; border-radius: 2px;
  color: var(--muted); cursor: pointer;
}
.subtab-active { background: var(--bg); color: var(--ink); box-shadow: var(--shadow-1); }

.decision-section { margin-bottom: 16px; }
.section-label {
  font-size: 10.5px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 6px;
  display: flex; align-items: center; justify-content: space-between;
}
.section-body { font-size: 13px; line-height: 1.55; max-width: 68ch; }
.section-why {
  padding: 8px 10px;
  background: var(--accent-green-soft);
  border-left: 2px solid var(--accent-green);
  border-radius: 0 3px 3px 0;
}

.options { display: grid; gap: 6px; }
.option {
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg);
}
.option-chosen { border-color: var(--accent-green); background: var(--accent-green-soft); }
.option-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.option-marker { color: var(--accent-green); font-size: 13px; }
.option-chosen .option-marker { color: var(--ink); }
.option-label { font-weight: 500; font-size: 12.5px; }
.option-tag {
  margin-left: auto;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--ink); background: var(--bg);
  padding: 1px 6px; border-radius: 2px;
  border: 1px solid var(--accent-green);
}
.option-reason { color: var(--muted); font-size: 12px; padding-left: 20px; }
.option-chosen .option-reason { color: var(--ink); opacity: 0.85; }

/* Annotated */
.transcript { display: grid; gap: 10px; max-width: 78ch; }
.transcript-line { display: grid; grid-template-columns: 80px 1fr; gap: 8px; font-size: 12.5px; line-height: 1.6; }
.role-tag {
  font-family: var(--font-mono); font-size: 10px;
  padding: 2px 6px; border-radius: 2px;
  text-align: center; align-self: start;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.role-sys { background: var(--surface-2); color: var(--muted); }
.role-tool, .role-toolresult { background: #eef2f4; color: #334155; }
.role-asst, .role-assistant { background: var(--accent-green-soft); color: #0f5132; }
.role-user { background: #fef3c7; color: #78350f; }
mark.mark-red { background: var(--accent-red-soft); color: var(--accent-red); padding: 0 3px; border-radius: 2px; }
mark.mark-green { background: var(--accent-green-soft); color: #0f5132; padding: 0 3px; border-radius: 2px; font-weight: 500; }
.code-inline {
  background: var(--surface);
  padding: 8px 10px; margin: 6px 0; border-radius: 3px;
  font-family: var(--font-mono); font-size: 11.5px; line-height: 1.55;
  white-space: pre; overflow-x: auto;
  border: 1px solid var(--border);
}
.legend-mini {
  display: flex; gap: 14px;
  margin-top: 12px; padding-top: 8px;
  border-top: 1px dashed var(--border);
  font-size: 11px; color: var(--muted);
}

/* Diff */
.decision-diff {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.diff-col {
  border: 1px solid var(--border); border-radius: 3px;
  background: var(--bg);
}
.diff-head {
  padding: 6px 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-size: 11px; color: var(--muted);
  font-family: var(--font-mono);
}
.diff-body { padding: 8px 10px; display: grid; gap: 4px; }
.diff-row { font-family: var(--font-mono); font-size: 11.5px; }
.diff-row.add { color: #0f5132; }
.diff-row.remove { color: var(--accent-red); text-decoration: line-through; opacity: 0.7; }
.diff-row.muted { color: var(--muted); }

/* ───────── Context / tools / files ───────── */
.context-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 0; font-size: 11px;
}
.context-body {
  background: var(--surface); border: 1px solid var(--border);
  padding: 10px 12px; border-radius: 3px;
  white-space: pre-wrap; word-break: break-word;
  font-size: 11.5px; line-height: 1.55;
  margin: 0;
}
.tools-list { display: grid; gap: 6px; }
.tool-row {
  display: grid; grid-template-columns: 120px 1fr auto; gap: 12px;
  padding: 8px 10px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 3px;
  font-size: 11.5px; align-items: center;
}
.tool-name { color: var(--ink); font-weight: 500; }
.tool-args { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool-result { color: var(--accent-green); }
.files-list { display: grid; gap: 4px; }
.file-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 3px;
}
.file-icon { color: var(--muted); }
.file-path { flex: 1; font-size: 12px; }
.file-action { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; }

/* Compare */
.compare-grid { display: grid; gap: 10px; }
.compare-col {
  padding: 10px; border: 1px solid var(--border); border-radius: 3px;
  background: var(--bg); display: grid; gap: 4px;
}
.compare-col-active { border-color: var(--ink); background: var(--surface); }
.compare-head {
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 6px; border-bottom: 1px dashed var(--border);
  margin-bottom: 4px;
}
.compare-summary {
  font-size: 11.5px; color: var(--muted); line-height: 1.45;
  padding-top: 6px; border-top: 1px dashed var(--border); margin-top: 4px;
}
.pill {
  display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 2px;
  font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em;
}
.pill-green { background: var(--accent-green-soft); color: #0f5132; }
.pill-amber { background: var(--accent-amber-soft); color: #78350f; }
.pill-neutral { background: var(--surface-2); color: var(--muted); }

.raw-json {
  background: var(--surface); padding: 10px 12px; border-radius: 3px;
  border: 1px solid var(--border);
  font-size: 11px; line-height: 1.45; margin: 0;
  white-space: pre-wrap;
}

/* ───────── Empty ───────── */
.empty, .empty-small {
  color: var(--muted); padding: 24px; text-align: center;
  font-size: 12px;
}
.empty-small { padding: 16px; }

/* ───────── Branch panel ───────── */
.branch-body { flex: 1; overflow-y: auto; padding: 12px; }
.branch-section { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px dashed var(--border); }
.branch-section:last-child { border-bottom: none; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }

.model-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
}
.model-card {
  text-align: left; padding: 7px 9px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
  cursor: pointer; display: grid; gap: 2px;
}
.model-card:hover { border-color: var(--border-strong); }
.model-card.is-selected { border-color: var(--ink); background: var(--surface-2); }
.model-name { font-size: 11.5px; font-weight: 500; color: var(--ink); }
.model-meta { font-size: 10px; color: var(--muted); display: flex; gap: 4px; }

.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.slider {
  width: 100%; -webkit-appearance: none; appearance: none;
  height: 4px; background: var(--border); border-radius: 2px; outline: none;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
  background: var(--ink); cursor: pointer;
}
.slider::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%; background: var(--ink);
  cursor: pointer; border: none;
}

.msg-list { display: grid; gap: 6px; }
.msg {
  background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
  overflow: hidden;
}
.msg-off { opacity: 0.5; }
.msg-new { border-color: var(--accent-amber); background: var(--accent-amber-soft); }
.msg-head {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 8px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  font-size: 11px;
}
.msg-head select {
  background: var(--bg); border: 1px solid var(--border); padding: 1px 4px;
  border-radius: 2px; font-family: var(--font-mono); font-size: 10.5px;
}
.msg-head input[type="checkbox"] { margin: 0; }
.msg-body {
  width: 100%; border: none; outline: none; resize: vertical;
  padding: 6px 8px; background: transparent;
  font-family: var(--font-mono); font-size: 11.5px; line-height: 1.45;
  display: block;
}
.user-msg { border: 1px solid var(--border); background: var(--bg); border-radius: 3px; }

.estimate { background: var(--surface); padding: 10px; border-radius: 3px; border-bottom: none; }
.estimate-row {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 12px;
}

.branch-footer {
  display: flex; gap: 8px; justify-content: flex-end;
  padding: 10px 12px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}

.msg-preview { padding: 6px 8px; color: var(--muted); font-size: 11px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx-hint { font-size: 10px; margin-bottom: 6px; }
.msg-head .role-tag { flex-shrink: 0; }

/* ───────── Tweaks panel ───────── */
.tweaks {
  position: fixed; bottom: 12px; right: 12px;
  background: var(--bg); border: 1px solid var(--border-strong);
  border-radius: 4px; box-shadow: var(--shadow-2);
  width: 260px; z-index: 100; font-size: 12px;
}
.tweaks-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  font-weight: 600; font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.04em;
}
.tweaks-body { padding: 10px; display: grid; gap: 10px; }
.tweak-row { display: grid; gap: 4px; }
.tweak-label { font-size: 10.5px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.tweak-opts { display: flex; flex-wrap: wrap; gap: 4px; }
.tweak-opt {
  background: transparent; border: 1px solid var(--border);
  padding: 3px 8px; font-size: 11px; border-radius: 2px;
  cursor: pointer; color: var(--muted);
  font-family: var(--font-mono);
}
.tweak-opt.is-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ───────── Variations (applied by data-variant) ───────── */
/* A: warm-neutral (default) — above. */

/* B: mono ink */
[data-variant="ink"] {
  --bg: #0f1114;
  --surface: #16191d;
  --surface-2: #1d2126;
  --border: #262a30;
  --border-strong: #3a3f46;
  --ink: #ececec;
  --muted: #8a8f96;
  --muted-2: #60666d;
  --accent-green-soft: color-mix(in oklch, var(--accent-green) 18%, transparent);
  --accent-amber-soft: color-mix(in oklch, var(--accent-amber) 18%, transparent);
  --accent-red-soft:   color-mix(in oklch, var(--accent-red) 18%, transparent);
}
[data-variant="ink"] .trace-status.done { background: var(--muted); }
[data-variant="ink"] .role-sys { background: var(--surface-2); color: var(--muted); }
[data-variant="ink"] .role-tool, [data-variant="ink"] .role-toolresult { background: #1e2530; color: #a7c5e0; }
[data-variant="ink"] .role-user { background: #2b2414; color: #fde68a; }

function layoutTree(nodes, { includeBranches }) {
  // Build children map
  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  const children = {};
  nodes.forEach((n) => {
    if (!includeBranches && n.isBranch) return;
    if (n.parent) {

  const walk = (id, d) => {
    depth[id] = d;
    (children[id] || []).forEach((c) => walk(c, d + 1));
  };
  walk(root.id, 0);

  const row = {};

  const assign = (id) => {

    if (kids.length === 0) {
      row[id] = cursor++;
      return;
    }

    const main = kids.filter((k) => !byId[k].isBranch);
    const br = kids.filter((k) => byId[k].isBranch);

    [...main, ...br].forEach((k) => assign(k));

    if (kids.length === 1) row[id] = row[kids[0]];

  const ROW = 68;
  const PAD_X = 36;

      x: PAD_X + depth[n.id] * COL,
      y: PAD_Y + row[n.id] * ROW,
    }));

  const edges = [];
  nodesWithPos.forEach((n) => {
    if (n.parent && byId[n.parent]) {
      const p = nodesWithPos.find((x) => x.id === n.parent);
      if (p) edges.push({ from: p, to: n, branch: n.isBranch });

    nodes: nodesWithPos,
    edges,
    width: PAD_X * 2 + (maxDepth + 1) * COL,
    height: PAD_Y * 2 + (maxRow + 1) * ROW,
  };
}

function NodeGlyph({ node, selected, onClick }) {
  const r = 18;
  const fill =
    node.id === "n1"
      ? "var(--ink)"
      : node.highlighted
      ? "var(--accent-green)"
      : node.isBranch && node.kind === "experiment"
      ? "var(--accent-amber)"
      : node.isBranch
      ? "var(--surface)"
      : "var(--surface)";
  const stroke =
    node.isBranch && node.kind !== "experiment"
      ? "var(--accent-green)"
      : "var(--border-strong)";
  const textColor =
    node.id === "n1" || node.highlighted || (node.isBranch && node.kind === "experiment")
      ? "#fff"
      : "var(--ink)";

  return (
    <g
      transform={`translate(${node.x}, ${node.y})`}
      onClick={onClick}
      style={{ cursor: "pointer" }}
      className={`node-glyph ${selected ? "is-selected" : ""}`}
    >
      {selected && (
        <circle r={r + 6} fill="none" stroke="var(--ink)" strokeWidth="1.5" strokeDasharray="2 3" />
      )}
      <circle
        r={r}
        fill={fill}
        stroke={stroke}
        strokeWidth={node.highlighted ? 1.5 : 1}
        strokeDasharray={node.isBranch && node.kind !== "experiment" ? "3 2" : "0"}
      />
      <text
        textAnchor="middle"
        y={4}
        fontSize="10"
        fontFamily="var(--font-mono)"
        fontWeight="500"
        fill={textColor}
      >
        {node.label.length > 7 ? node.label.slice(0, 6) + "…" : node.label}
      </text>
      {/* meta below */}
      <g transform={`translate(0, ${r + 14})`}>
        <text textAnchor="middle" fontSize="9" fontFamily="var(--font-mono)" fill="var(--muted)">
          {fmtTok(node.inputTokens + node.outputTokens)} · ${node.cost.toFixed(3)}
        </text>
        <text textAnchor="middle" y={11} fontSize="8.5" fontFamily="var(--font-mono)" fill="var(--muted-2)">
          {shortModel(node.model)}
        </text>
      </g>
      {/* file dots on the right */}
      {node.files.length > 0 && (
        <g transform={`translate(${r + 4}, -${r - 2})`}>
          {node.files.slice(0, 3).map((f, i) => (
            <g key={i} transform={`translate(0, ${i * 10})`}>
              <rect width="3" height="3" fill="var(--muted)" />
              <text x={6} y={3} fontSize="8" fontFamily="var(--font-mono)" fill="var(--muted)">
                {basename(f)}
              </text>
            </g>
          ))}
        </g>
      )}
    </g>
  );
}

function fmtTok(n) {
  if (n >= 1000) return (n / 1000).toFixed(1) + "k";
  return n;
}
function shortModel(m) {
  return m.replace("claude-", "").replace("-4.5", "4.5").replace("-5", "5").replace("gpt-", "gpt");
}
function basename(p) {
  return p.split("/").pop();
}

function Edge({ e }) {
  const dx = e.to.x - e.from.x;
  const midX = e.from.x + dx * 0.5;
  const path = `M ${e.from.x + 18} ${e.from.y} C ${midX} ${e.from.y}, ${midX} ${e.to.y}, ${e.to.x - 18} ${e.to.y}`;
  return (
    <path
      d={path}
      fill="none"
      stroke={e.branch ? "var(--accent-green)" : "var(--border-strong)"}
      strokeWidth="1"
      strokeDasharray={e.branch ? "3 2" : "0"}
      markerEnd="url(#arrow)"
    />
  );
}

function TreePanel({ selected, onSelect, showBranches, onToggleBranches, variant }) {
  const layout = useMemo(
    () => layoutTree(window.NODES, { includeBranches: showBranches }),
    [showBranches]
  );
  const [zoom, setZoom] = useState(1);
  const bodyRef = useRef(null);

  const zoomIn = () => setZoom((z) => Math.min(2.5, +(z + 0.15).toFixed(2)));
  const zoomOut = () => setZoom((z) => Math.max(0.4, +(z - 0.15).toFixed(2)));
  const zoomReset = () => setZoom(1);

  const onWheel = (e) => {
    e.preventDefault();
    setZoom((z) => {
      const next = z - e.deltaY * 0.002;
      return Math.max(0.4, Math.min(2.5, +next.toFixed(2)));
    });
  };

  // Right-button drag to pan horizontally (and vertically)
  const [panning, setPanning] = useState(null);
  const onContextMenu = (e) => { e.preventDefault(); };
  const onMouseDown = (e) => {
    if (e.button !== 2) return;
    e.preventDefault();
    setPanning({ x: e.clientX, y: e.clientY, sl: bodyRef.current.scrollLeft, st: bodyRef.current.scrollTop });
  };
  const onMouseMove = (e) => {
    if (!panning) return;
    bodyRef.current.scrollLeft = panning.sl - (e.clientX - panning.x);
    bodyRef.current.scrollTop  = panning.st - (e.clientY - panning.y);
  };
  const onMouseUp = () => setPanning(null);

  useEffect(() => {
    if (!panning) return;
    const mv = (e) => onMouseMove(e);
    const up = () => setPanning(null);
    window.addEventListener("mousemove", mv);
    window.addEventListener("mouseup", up);
    return () => { window.removeEventListener("mousemove", mv); window.removeEventListener("mouseup", up); };
  }, [panning]);

  return (
    <div className="tree-panel" data-tree={variant}>
      <div className="panel-header">
        <div className="panel-title">
          <span className="dot dot-running" />
          <span>Call tree</span>
          <span className="muted" style={{ marginLeft: 8 }}>
            {layout.nodes.length} nodes · {showBranches ? "with branches" : "main only"}
          </span>
        </div>
        <div className="panel-actions">
          <button
            className={`chip ${showBranches ? "chip-on" : ""}`}
            onClick={onToggleBranches}
          >
            branches
          </button>
          <button className="chip">main</button>
          <button className="chip">errors</button>
          <div className="divider-v" />
          <button className="icon-btn" onClick={zoomOut} title="zoom out (−)">−</button>
          <button className="icon-btn mono" onClick={zoomReset} title="reset zoom" style={{ minWidth: 36 }}>{Math.round(zoom*100)}%</button>
          <button className="icon-btn" onClick={zoomIn} title="zoom in (+)">+</button>
          <button className="icon-btn" title="fit to screen" onClick={() => setZoom(1)}>fit</button>
        </div>
      </div>
      <div className="tree-body" ref={bodyRef} onWheel={onWheel} onMouseDown={onMouseDown} onContextMenu={onContextMenu} style={{ cursor: panning ? "grabbing" : "default" }}>
        <div style={{ transform: `scale(${zoom})`, transformOrigin: "0 0", width: layout.width * zoom, height: layout.height * zoom }}>
        <svg
          width={layout.width}
          height={layout.height}
          style={{ display: "block" }}
        >
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" fill="var(--border-strong)" />
            </marker>
            <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
              <circle cx="0.5" cy="0.5" r="0.5" fill="var(--border)" />
            </pattern>
          </defs>
          <rect width={layout.width} height={layout.height} fill="url(#grid)" opacity="0.5" />
          {layout.edges.map((e, i) => (
            <Edge key={i} e={e} />
          ))}
          {layout.nodes.map((n) => (
            <NodeGlyph
              key={n.id}
              node={n}
              selected={selected === n.id}
              onClick={() => onSelect(n.id)}
            />
          ))}
        </svg>
        </div>
      </div>
      <div className="tree-legend">
        <span><span className="swatch swatch-ink" /> root</span>
        <span><span className="swatch swatch-green" /> selected path</span>
        <span><span className="swatch swatch-green-out" /> alt model</span>
        <span><span className="swatch swatch-amber" /> experiment</span>
      </div>
    </div>
  );
}

window.TreePanel = TreePanel;
</script>
<script type="text/babel" data-presets="react">// Node detail panel — tabs: Decision, Context, Tools, Files, Compare
const { useState: useState_ND } = React;

function Pill({ children, tone }) {
  return <span className={`pill pill-${tone || "neutral"}`}>{children}</span>;
}

function KV({ k, v, mono }) {

    <div className="kv">

}

function NodeDetail({ node, onBranch, branchOpen, allNodes }) {
  const [tab, setTab] = useState_ND("decision");

    return (
      <div className="detail-panel">
        <div className="empty">Select a node to inspect.</div>

  const siblings = allNodes.filter((n) => n.parent === node.parent && n.id !== node.id);
  const parent = allNodes.find((n) => n.id === node.parent);

  return (
    <div className="detail-panel">
      <div className="panel-header">
        <div className="panel-title">

        <div className="panel-actions">
          <button
            className={`btn btn-primary ${branchOpen ? "is-active" : ""}`}

            {branchOpen ? "close branch" : "+ branch from here"}
          </button>
        </div>
      </div>

      <div className="node-summary">
        <div className="node-summary-main">
          <div className="node-id mono">{node.id}</div>
          <div className="node-label">{node.summary}</div>
        </div>
        <div className="node-stats">
          <KV k="model" v={node.model} mono />
          <KV k="tokens in" v={node.inputTokens.toLocaleString()} mono />
          <KV k="tokens out" v={node.outputTokens.toLocaleString()} mono />
          <KV k="cost" v={`$${node.cost.toFixed(3)}`} mono />
          <KV k="latency" v={`${(node.latency / 1000).toFixed(2)}s`} mono />
          <KV k="ttft" v={`${node.ttft}ms`} mono />
        </div>
      </div>

      <div className="tabs">
        {[
          ["decision", "Decision"],
          ["context", "Context"],
          ["tools", "Tools"],
          ["files", "Files"],
          ["compare", `Compare${siblings.length ? ` · ${siblings.length}` : ""}`],
          ["raw", "Raw"],
        ].map(([k, l]) => (
          <button
            key={k}
            className={`tab ${tab === k ? "tab-active" : ""}`}

        {tab === "compare" && <CompareView node={node} siblings={siblings} />}

}

function DecisionView({ node, parent, sub, onSub }) {
  const d = node.decision;

          ["structured", "Structured"],
          ["annotated", "Annotated"],

              {d.options.map((o, i) => (
                <div key={i} className={`option ${o.chosen ? "option-chosen" : ""}`}>
                  <div className="option-head">
                    <span className="option-marker">{o.chosen ? "●" : "○"}</span>
                    <span className="option-label">{o.label}</span>
                    {o.chosen && <span className="option-tag">chosen</span>}
                  </div>
                  <div className="option-reason">{o.reason}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="decision-section">
            <div className="section-label">Why this one</div>
            <div className="section-body section-why">{d.why}</div>
          </div>
        </div>
      )}

      {sub === "annotated" && (
        <div className="decision-annotated">
          <div className="transcript">
            <div className="transcript-line">
              <span className="role-tag role-sys">system</span>
              <span>You are a coding agent working on acme/web.</span>
            </div>
            <div className="transcript-line">
              <span className="role-tag role-tool">tool_result</span>
              <span>
                <span className="mono muted">read_file(src/pages/auth/callback.ts)</span>
                <pre className="code-inline">
{`47:  cookies.set('sid', token, {\n       `}<mark className="mark-red">{`domain: '.auth.acme.com'`}</mark>{`,\n       httpOnly: true,\n     });`}
                </pre>
              </span>
            </div>
            <div className="transcript-line">
              <span className="role-tag role-asst">assistant</span>
              <span>
                The cookie is scoped to <mark className="mark-red">'.auth.acme.com'</mark> but the app runs on
                <mark className="mark-red"> 'app.acme.com'</mark>.{" "}
                <mark className="mark-green">Fix: change domain to '.acme.com'</mark> so both subdomains share it.
              </span>
            </div>
          </div>
          <div className="legend-mini">
            <span><mark className="mark-red">red</mark> bug signal</span>
            <span><mark className="mark-green">green</mark> the decision</span>

      {sub === "diff" && (
        <div className="decision-diff">
          <div className="diff-col">
            <div className="diff-head">Parent: {parent ? parent.label : "—"}</div>
            <div className="diff-body">
              <div className="diff-row">+ located 4 auth files</div>
              <div className="diff-row">+ read auth middleware (174 lines)</div>
              <div className="diff-row muted">· no bug hypothesis yet</div>
            </div>
          </div>
          <div className="diff-col">
            <div className="diff-head">This node: {node.label}</div>
            <div className="diff-body">
              <div className="diff-row add">+ read callback.ts (98 lines)</div>
              <div className="diff-row add">+ hypothesis: cookie domain mismatch</div>
              <div className="diff-row add">+ target line: 47</div>
              <div className="diff-row remove">- rejected: TTL, session store, CSRF</div>
            </div>
          </div>
        </div>
      )}

}

function ContextView({ node }) {
  return (
    <div className="context">
      <div className="context-head">
        <span className="muted">Context window fed to this call</span>
        <span className="mono muted">{node.inputTokens.toLocaleString()} tok in</span>
      </div>
      <pre className="context-body mono">{node.input}</pre>
      <div className="context-head" style={{ marginTop: 16 }}>
        <span className="muted">Model output</span>
        <span className="mono muted">{node.outputTokens.toLocaleString()} tok out</span>
      </div>
      <pre className="context-body mono">{node.output}</pre>
    </div>
  );
}

function ToolsView({ node }) {
  if (!node.toolCalls || node.toolCalls.length === 0)
    return <div className="empty-small">No tool calls from this node.</div>;
  return (
    <div className="tools-list">
      {node.toolCalls.map((t, i) => (
        <div key={i} className="tool-row">
          <div className="tool-name mono">{t.name}</div>
          <div className="tool-args mono">{JSON.stringify(t.args)}</div>
          <div className="tool-result mono">{t.result}</div>
        </div>
      ))}
    </div>
  );
}

function FilesView({ node }) {
  if (node.files.length === 0) return <div className="empty-small">No files touched.</div>;
  return (
    <div className="files-list">
      {node.files.map((f, i) => (
        <div key={i} className="file-row">
          <span className="file-icon">◫</span>
          <span className="file-path mono">{f}</span>
          <span className="file-action muted">read</span>
        </div>
      ))}
    </div>
  );
}

function CompareView({ node, siblings }) {
  if (siblings.length === 0)
    return <div className="empty-small">No sibling branches to compare.</div>;
  const cols = [node, ...siblings];
  return (
    <div className="compare-grid" style={{ gridTemplateColumns: `repeat(${cols.length}, 1fr)` }}>
      {cols.map((n) => (
        <div key={n.id} className={`compare-col ${n.id === node.id ? "compare-col-active" : ""}`}>
          <div className="compare-head">
            <span className="mono">{n.label}</span>
            {n.isBranch && <Pill tone={n.kind === "experiment" ? "amber" : "green"}>{n.branchLabel}</Pill>}
          </div>
          <KV k="model" v={n.model} mono />
          <KV k="tokens" v={(n.inputTokens + n.outputTokens).toLocaleString()} mono />
          <KV k="cost" v={`$${n.cost.toFixed(3)}`} mono />
          <KV k="latency" v={`${(n.latency / 1000).toFixed(2)}s`} mono />
          <div className="compare-summary">{n.summary}</div>
        </div>
      ))}
    </div>
  );
}

function RawView({ node }) {
  return <pre className="raw-json mono">{JSON.stringify(node, null, 2)}</pre>;
}

window.NodeDetail = NodeDetail;
</script>
<script type="text/babel" data-presets="react">// Branch experiment panel — slide-in from right of node detail
const { useState: useState_B } = React;

const MODELS = [
  { id: "claude-sonnet-4.5", provider: "anthropic", in: 3, out: 15 },
  { id: "claude-opus-4", provider: "anthropic", in: 15, out: 75 },
  { id: "claude-haiku-4.5", provider: "anthropic", in: 0.8, out: 4 },
  { id: "gpt-5", provider: "openai", in: 5, out: 20 },
  { id: "gpt-5-mini", provider: "openai", in: 0.25, out: 2 },
  { id: "gemini-2.5-pro", provider: "google", in: 2.5, out: 10 },
  { id: "llama-4-405b", provider: "meta", in: 3, out: 3 },
];

// Build the full context chain from node's ancestors.
// Each ancestor contributes: (optional) system (first only), user msg, assistant output, tool_results.
function buildContextChain(node, allNodes) {
  const chain = [];
  let cur = node;
  const path = [];
  while (cur) {
    path.unshift(cur);
    cur = allNodes.find((n) => n.id === cur.parent);
  }
  // Root system prompt
  chain.push({
    role: "system",
    content: "You are a coding agent working on acme/web. Diagnose issues, read files, make minimal patches, and verify with tests.",
    enabled: true,
    source: "system",
  });
  path.forEach((n, i) => {
    // Extract user tag or treat input as user if first
    const userMatch = n.input && n.input.match(/<user>([\s\S]*?)<\/user>/);
    if (userMatch) {
      chain.push({ role: "user", content: userMatch[1].trim(), enabled: true, source: n.id });
    }
    // Tool results feeding this node
    (n.toolCalls || []).forEach((t) => {
      chain.push({
        role: "tool_result",
        content: `${t.name}(${JSON.stringify(t.args)}) → ${t.result}`,
        enabled: true,
        source: n.id,
      });
    });
    // Assistant output (don't include the target node's own output — that's what we're re-generating)
    if (i < path.length - 1 && n.output) {
      chain.push({ role: "assistant", content: n.output, enabled: true, source: n.id });
    }
  });
  return chain;
}

function BranchPanel({ node, onClose, onSubmit, allNodes }) {
  const [model, setModel] = useState_B("claude-opus-4");
  const [temp, setTemp] = useState_B(0.3);
  const [topP, setTopP] = useState_B(0.95);
  const userMatch = node.input && node.input.match(/<user>([\s\S]*?)<\/user>/);
  const [userMsg, setUserMsg] = useState_B(
    userMatch ? userMatch[1].trim() : "Diagnose the loop."
  );
  const [ctxMessages, setCtxMessages] = useState_B(() => buildContextChain(node, allNodes));
  const [collapsedIds, setCollapsedIds] = useState_B(new Set());
  const toggleCollapse = (i) => setCollapsedIds((s) => {
    const next = new Set(s); next.has(i) ? next.delete(i) : next.add(i); return next;
  });
  const [addingMsg, setAddingMsg] = useState_B(false);
  const [newMsg, setNewMsg] = useState_B({ role: "user", content: "" });

  const m = MODELS.find((x) => x.id === model);
  const estInTok = ctxMessages.filter((c) => c.enabled).reduce((a, c) => a + c.content.length / 4, 0) + userMsg.length / 4;
  const estOutTok = 600;
  const estCost = (estInTok * m.in + estOutTok * m.out) / 1_000_000;

  const toggleMsg = (i) => {
    setCtxMessages((arr) =>
      arr.map((m, j) => (j === i ? { ...m, enabled: !m.enabled } : m))
    );
  };
  const removeMsg = (i) => setCtxMessages((arr) => arr.filter((_, j) => j !== i));
  const editMsg = (i, content) =>
    setCtxMessages((arr) => arr.map((m, j) => (j === i ? { ...m, content } : m)));

  return (
    <div className="branch-panel">
      <div className="panel-header">
        <div className="panel-title">
          <span className="branch-dot" />
          <span>Branch from <span className="mono">{node.id}</span></span>
          <span className="muted" style={{ marginLeft: 8 }}>experiment</span>
        </div>
        <div className="panel-actions">
          <button className="icon-btn" onClick={onClose} title="close">✕</button>
        </div>
      </div>

      <div className="branch-body">
        <section className="branch-section">
          <div className="section-label">Model</div>
          <div className="model-grid">
            {MODELS.map((mm) => (
              <button
                key={mm.id}
                className={`model-card ${model === mm.id ? "is-selected" : ""}`}
                onClick={() => setModel(mm.id)}
              >
                <div className="model-name mono">{mm.id}</div>
                <div className="model-meta mono">
                  <span>{mm.provider}</span>
                  <span>·</span>
                  <span>${mm.in}/{mm.out}</span>
                </div>
              </button>
            ))}
          </div>
        </section>

        <section className="branch-section">
          <div className="row-2">
            <div>
              <div className="section-label">
                Temperature <span className="mono muted">{temp.toFixed(2)}</span>
              </div>
              <input
                type="range"
                min="0"
                max="1"
                step="0.05"
                value={temp}
                onChange={(e) => setTemp(+e.target.value)}
                className="slider"
              />
            </div>
            <div>
              <div className="section-label">
                Top-p <span className="mono muted">{topP.toFixed(2)}</span>
              </div>
              <input
                type="range"
                min="0"
                max="1"

              />

          </div>

            </div>

            {ctxMessages.map((m, i) => {

                  {m.source && m.source !== "system" && (
                    <span className="mono muted" style={{ fontSize: 10 }}>from {m.source}</span>
                  )}
                  <span className="mono muted" style={{ fontSize: 10 }}>~{tok}t</span>
                  <div style={{ flex: 1 }} />
                  <button className="icon-btn-sm" onClick={() => toggleCollapse(i)} title={collapsed ? "expand" : "collapse"}>{collapsed ? "▸" : "▾"}</button>
                  <button className="icon-btn-sm" onClick={() => removeMsg(i)}>✕</button>
                </div>
                {!collapsed && (
                  <textarea
                    className="msg-body mono"
                    value={m.content}
                    rows={Math.min(10, Math.max(2, m.content.split("\n").length + 1))}

                )}
                {collapsed && (
                  <div className="msg-preview mono">{m.content.slice(0, 80)}{m.content.length > 80 ? "…" : ""}</div>
                )}
              </div>
            );})}
            {addingMsg && (
              <div className="msg msg-new">
                <div className="msg-head">
                  <select
                    value={newMsg.role}
                    onChange={(e) => setNewMsg({ ...newMsg, role: e.target.value })}
                  >
                    <option value="system">system</option>
                    <option value="user">user</option>
                    <option value="assistant">assistant</option>
                    <option value="tool_result">tool_result</option>
                  </select>
                  <div style={{ flex: 1 }} />
                  <button
                    className="chip-mini"
                    onClick={() => {
                      if (newMsg.content.trim()) {
                        setCtxMessages((a) => [...a, { ...newMsg, enabled: true }]);
                        setNewMsg({ role: "user", content: "" });
                        setAddingMsg(false);
                      }
                    }}
                  >
                    add
                  </button>
                  <button className="icon-btn-sm" onClick={() => setAddingMsg(false)}>✕</button>
                </div>
                <textarea
                  className="msg-body mono"
                  rows={3}
                  placeholder="message content…"
                  value={newMsg.content}
                  onChange={(e) => setNewMsg({ ...newMsg, content: e.target.value })}
                />
              </div>
            )}
          </div>
        </section>

        <section className="branch-section">
          <div className="section-label">User message / task</div>
          <textarea
            className="msg-body mono user-msg"
            value={userMsg}
            rows={4}
            onChange={(e) => setUserMsg(e.target.value)}
          />
        </section>

        <section className="branch-section estimate">
          <div className="estimate-row">
            <KV k="est. input" v={`${Math.round(estInTok).toLocaleString()} tok`} mono />
            <KV k="est. output" v={`${estOutTok} tok`} mono />
            <KV k="est. cost" v={`$${estCost.toFixed(4)}`} mono />
            <KV k="eta" v={`~${(estOutTok / 40).toFixed(1)}s`} mono />
          </div>
        </section>
      </div>

      <div className="branch-footer">
        <button className="btn btn-ghost" onClick={onClose}>cancel</button>
        <button className="btn btn-ghost">save as template</button>
        <button className="btn btn-primary" onClick={() => onSubmit({ model, temp, topP })}>
          ↳ run branch
        </button>
      </div>
    </div>
  );
}

function WikiView() {
  const slugs = Object.keys(WIKI_PAGES);
  const [active, setActive] = useWS("README");
  const [q, setQ] = useWS("");

  const filtered = slugs.filter(
    (s) => s.toLowerCase().includes(q.toLowerCase()) || WIKI_PAGES[s].body.toLowerCase().includes(q.toLowerCase())
  );

  const page = WIKI_PAGES[active];
  const backlinks = slugs.filter((s) => s !== active && WIKI_PAGES[s].links?.includes(active));

  // Render body: markdown-lite with [[links]]
  const renderBody = (body) => {
    const lines = body.split("\n");
    return lines.map((ln, i) => {
      if (ln.startsWith("# ")) return <h1 key={i} className="w-h1">{ln.slice(2)}</h1>;
      if (ln.startsWith("## ")) return <h2 key={i} className="w-h2">{ln.slice(3)}</h2>;
      if (ln.startsWith("> ")) return <blockquote key={i} className="w-bq">{parseInline(ln.slice(2), setActive)}</blockquote>;
      if (/^\d+\.\s/.test(ln)) return <li key={i} className="w-ol">{parseInline(ln.replace(/^\d+\.\s/, ""), setActive)}</li>;
      if (ln.startsWith("- ")) return <li key={i} className="w-ul">{parseInline(ln.slice(2), setActive)}</li>;
      if (ln.trim() === "") return <div key={i} className="w-br" />;
      return <p key={i} className="w-p">{parseInline(ln, setActive)}</p>;
    });
  };

  return (
    <div className="wiki">
      <aside className="wiki-sidebar">
        <div className="wiki-search">
          <input
            placeholder="Search pages…"
            value={q}
            onChange={(e) => setQ(e.target.value)}
          />
        </div>
        <div className="wiki-list">
          {filtered.map((s) => (
            <div
              key={s}
              className={`wiki-item ${active === s ? "is-active" : ""}`}
              onClick={() => setActive(s)}
            >
              <div className="wiki-item-title">{WIKI_PAGES[s].title}</div>
              <div className="wiki-item-meta mono">
                {WIKI_PAGES[s].tags.slice(0, 2).join(" · ")}
              </div>
            </div>
          ))}
        </div>
      </aside>

      <div className="wiki-main">
        <div className="wiki-breadcrumb">
          <span className="mono muted">/ wiki / {page.title}</span>
          <span className="wiki-tags">
            {page.tags.map((t) => <span key={t} className="wiki-tag mono">#{t}</span>)}
          </span>
          <span className="mono muted">updated {page.updated}</span>
        </div>
        <div className="wiki-body">{renderBody(page.body)}</div>
        {backlinks.length > 0 && (
          <div className="wiki-backlinks">
            <div className="section-label">Linked from ({backlinks.length})</div>
            {backlinks.map((b) => (
              <div key={b} className="backlink" onClick={() => setActive(b)}>
                ← {WIKI_PAGES[b].title}
              </div>
            ))}
          </div>
        )}
      </div>

      <aside className="wiki-graph">
        <div className="section-label" style={{ padding: "10px 12px 4px" }}>Local graph</div>
        <WikiGraph active={active} onNavigate={setActive} />
      </aside>
    </div>
  );
}

function parseInline(text, navigate) {
  // [[wikilinks]]
  const parts = [];
  let last = 0;
  const re = /\[\[([^\]]+)\]\]/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    const key = m[1];
    parts.push(
      <span key={m.index} className="wikilink" onClick={() => navigate(key)}>{key}</span>
    );
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push(text.slice(last));
  return parts;
}

function WikiGraph({ active, onNavigate }) {
  // Force-directed-ish layout, precomputed positions per page.
  const slugs = Object.keys(WIKI_PAGES);
  const positions = useWM(() => {
    const pos = {};
    slugs.forEach((s, i) => {
      const a = (i / slugs.length) * Math.PI * 2;
      pos[s] = { x: 120 + Math.cos(a) * 72, y: 130 + Math.sin(a) * 72 };
    });
    // Center the active
    pos[active] = { x: 120, y: 130 };
    return pos;
  }, [active, slugs.length]);

  const edges = [];
  slugs.forEach((s) => {
    (WIKI_PAGES[s].links || []).forEach((l) => {
      if (WIKI_PAGES[l]) edges.push([s, l]);
    });
  });

  return (
    <svg viewBox="0 0 240 260" width="100%" style={{ padding: 8 }}>
      {edges.map(([a, b], i) => {
        const pa = positions[a], pb = positions[b];
        const hl = a === active || b === active;
        return <line key={i} x1={pa.x} y1={pa.y} x2={pb.x} y2={pb.y} stroke={hl ? "var(--accent-green)" : "var(--border)"} strokeWidth={hl ? 1 : 0.6} />;
      })}
      {slugs.map((s) => {
        const p = positions[s];
        const isActive = s === active;
        return (
          <g key={s} transform={`translate(${p.x},${p.y})`} onClick={() => onNavigate(s)} style={{ cursor: "pointer" }}>
            <circle r={isActive ? 5 : 3.5} fill={isActive ? "var(--accent-green)" : "var(--surface)"} stroke="var(--ink)" strokeWidth={isActive ? 1.2 : 0.8} />
            <text y={-8} textAnchor="middle" fontSize="8" fontFamily="var(--font-mono)" fill={isActive ? "var(--ink)" : "var(--muted)"}>{s.slice(0, 14)}</text>
          </g>
        );
      })}
    </svg>
  );
}

// ───────── CODE GRAPH (AST / semantic model) ─────────
const CODE_NODES = [
  { id: "auth.ts",       label: "auth.ts",       kind: "module", x: 160, y: 80 },
  { id: "callback.ts",   label: "callback.ts",   kind: "module", x: 380, y: 80 },
  { id: "login.ts",      label: "login.ts",      kind: "module", x: 560, y: 160 },
  { id: "session.ts",    label: "session.ts",    kind: "module", x: 280, y: 240 },
  { id: "cookies.ts",    label: "cookies.ts",    kind: "module", x: 480, y: 260 },

  { id: "isValidSession",kind: "fn",     parent: "auth.ts",     label: "isValidSession", x: 80,  y: 40 },
  { id: "middleware",    kind: "fn",     parent: "auth.ts",     label: "middleware",     x: 240, y: 40, hot: true },
  { id: "setSid",        kind: "fn",     parent: "callback.ts", label: "setSid",         x: 380, y: 40, warn: true },
  { id: "handleCallback",kind: "fn",     parent: "callback.ts", label: "handleCallback", x: 480, y: 140 },
  { id: "signSession",   kind: "fn",     parent: "session.ts",  label: "signSession",    x: 200, y: 280 },
  { id: "verifySession", kind: "fn",     parent: "session.ts",  label: "verifySession",  x: 340, y: 300 },
  { id: "COOKIE_DOMAIN", kind: "const",  parent: "cookies.ts",  label: "COOKIE_DOMAIN",  x: 560, y: 320 },
];
const CODE_EDGES = [
  ["middleware", "isValidSession", "calls"],
  ["isValidSession", "verifySession", "calls"],
  ["handleCallback", "setSid", "calls"],
  ["setSid", "signSession", "calls"],
  ["verifySession", "signSession", "uses"],
  ["setSid", "COOKIE_DOMAIN", "reads", "proposed"],
  ["middleware", "setSid", "redirect-loop", "bug"],
];

function CodeGraphView() {
  const [hover, setHover] = useWS(null);
  const [sel, setSel] = useWS("setSid");

  const node = CODE_NODES.find((n) => n.id === sel);

  return (
    <div className="codegraph">
      <aside className="cg-side">
        <div className="section-label" style={{ padding: "10px 12px 4px" }}>Symbols</div>
        <div className="cg-tree">
          {CODE_NODES.filter((n) => n.kind === "module").map((m) => (
            <div key={m.id}>
              <div className="cg-module mono">◫ {m.label}</div>
              {CODE_NODES.filter((n) => n.parent === m.id).map((fn) => (
                <div
                  key={fn.id}
                  className={`cg-symbol mono ${sel === fn.id ? "is-sel" : ""}`}
                  onClick={() => setSel(fn.id)}
                >
                  <span className={`cg-marker cg-marker-${fn.kind}`}>
                    {fn.kind === "fn" ? "ƒ" : fn.kind === "const" ? "k" : "•"}
                  </span>
                  {fn.label}
                  {fn.hot && <span className="cg-badge cg-badge-hot">hot</span>}
                  {fn.warn && <span className="cg-badge cg-badge-warn">warn</span>}
                </div>
              ))}
            </div>
          ))}
        </div>
        <div className="section-label" style={{ padding: "10px 12px 4px" }}>Legend</div>
        <div className="cg-legend mono">
          <div><span className="cg-marker cg-marker-fn">ƒ</span> function</div>
          <div><span className="cg-marker cg-marker-const">k</span> constant</div>
          <div><span className="cg-edge-demo" /> calls</div>
          <div><span className="cg-edge-demo cg-edge-bug" /> bug path</div>
          <div><span className="cg-edge-demo cg-edge-proposed" /> proposed (trc_9f2a/n4b)</div>
        </div>
      </aside>

      <div className="cg-canvas">
        <svg width="100%" height="100%" viewBox="0 0 700 420" preserveAspectRatio="xMidYMid meet">
          <defs>
            <marker id="cg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" />
            </marker>
            <marker id="cg-arrow-bug" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-red)" />
            </marker>
          </defs>
          {/* Module containers */}
          {CODE_NODES.filter((n) => n.kind === "module").map((m) => {
            const kids = CODE_NODES.filter((k) => k.parent === m.id);
            if (!kids.length) return null;
            const xs = kids.map((k) => k.x);
            const ys = kids.map((k) => k.y);
            const minX = Math.min(...xs) - 40, maxX = Math.max(...xs) + 40;
            const minY = Math.min(...ys) - 20, maxY = Math.max(...ys) + 20;
            return (
              <g key={m.id}>
                <rect x={minX} y={minY} width={maxX - minX} height={maxY - minY} rx={6}
                      fill="var(--surface)" stroke="var(--border)" strokeDasharray="3 3" />
                <text x={minX + 8} y={minY + 14} fontSize="9" fontFamily="var(--font-mono)" fill="var(--muted)">{m.label}</text>
              </g>
            );
          })}
          {/* Edges */}
          {CODE_EDGES.map(([a, b, kind, tag], i) => {
            const na = CODE_NODES.find((n) => n.id === a);
            const nb = CODE_NODES.find((n) => n.id === b);
            if (!na || !nb) return null;
            const isBug = tag === "bug";
            const isProposed = tag === "proposed";
            return (
              <g key={i}>
                <line
                  x1={na.x} y1={na.y} x2={nb.x} y2={nb.y}
                  stroke={isBug ? "var(--accent-red)" : isProposed ? "var(--accent-amber)" : "var(--muted)"}
                  strokeWidth={isBug ? 1.5 : 0.8}
                  strokeDasharray={isProposed ? "3 3" : isBug ? "0" : "0"}
                  markerEnd={isBug ? "url(#cg-arrow-bug)" : "url(#cg-arrow)"}
                  opacity={isBug ? 0.9 : 0.7}
                />
                <text
                  x={(na.x + nb.x) / 2} y={(na.y + nb.y) / 2 - 3}
                  fontSize="8" fontFamily="var(--font-mono)"
                  fill={isBug ? "var(--accent-red)" : "var(--muted)"}
                  textAnchor="middle"
                >
                  {kind}
                </text>
              </g>
            );
          })}
          {/* Function nodes */}
          {CODE_NODES.filter((n) => n.kind !== "module").map((n) => {
            const isSel = sel === n.id;
            const isHover = hover === n.id;
            return (
              <g key={n.id} transform={`translate(${n.x},${n.y})`}
                 onClick={() => setSel(n.id)} onMouseEnter={() => setHover(n.id)} onMouseLeave={() => setHover(null)}
                 style={{ cursor: "pointer" }}>
                <rect x={-48} y={-11} width={96} height={22} rx={3}
                      fill={n.hot ? "var(--accent-green-soft)" : n.warn ? "var(--accent-red-soft)" : "var(--bg)"}
                      stroke={isSel ? "var(--ink)" : "var(--border-strong)"}
                      strokeWidth={isSel ? 1.5 : 1} />
                <text textAnchor="middle" y={3} fontSize="10" fontFamily="var(--font-mono)" fill="var(--ink)">
                  {n.kind === "fn" ? "ƒ " : n.kind === "const" ? "k " : ""}{n.label}
                </text>
              </g>
            );
          })}
        </svg>
      </div>

      <aside className="cg-detail">
        {node && (
          <>
            <div className="panel-header" style={{ padding: "10px 12px" }}>
              <div className="panel-title">
                <span className="mono">{node.kind === "fn" ? "ƒ" : "k"} {node.label}</span>
              </div>
            </div>
            <div className="cg-detail-body">
              <KV k="file" v={node.parent} mono />
              <KV k="kind" v={node.kind} mono />
              <KV k="callers" v={CODE_EDGES.filter(([,b]) => b === node.id).length} mono />
              <KV k="callees" v={CODE_EDGES.filter(([a]) => a === node.id).length} mono />
              <div style={{ marginTop: 12 }} className="section-label">Signature</div>
              <pre className="cg-signature mono">
{node.id === "setSid" ? `function setSid(token: string, res: Response): void`
: node.id === "middleware" ? `async function middleware(req: Request): Promise<Response>`
: node.id === "isValidSession" ? `function isValidSession(req: Request): boolean`
: node.id === "COOKIE_DOMAIN" ? `const COOKIE_DOMAIN: string = ".acme.com"`
: `// signature unavailable`}
              </pre>
              <div style={{ marginTop: 12 }} className="section-label">Touched by traces</div>
              <div className="cg-touch">
                <div className="mono">· trc_9f2a (main fix)</div>
                <div className="mono muted">· trc_9f2a/n4b (proposed refactor)</div>
              </div>
            </div>
          </>
        )}
      </aside>
    </div>
  );
}

window.WikiView = WikiView;
window.CodeGraphView = CodeGraphView;
</script>

      <div className="top-filters">
        <button className={`chip ${view === "trace" ? "chip-on" : ""}`} onClick={() => onView("trace")}>◎ trace</button>
        <button className={`chip ${view === "wiki" ? "chip-on" : ""}`} onClick={() => onView("wiki")}>§ wiki</button>
        <button className={`chip ${view === "code" ? "chip-on" : ""}`} onClick={() => onView("code")}>◇ code graph</button>
      </div>
      <div className="top-right">
        <span className="mono muted">{trace.repo}</span>
        <span className="divider-v" />
        <span className="mono muted">{trace.startedAt}</span>
        <span className="divider-v" />
        <button className="chip">settings</button>
      </div>
    </div>
  );
}

function Sidebar({ activeTrace, onSelect }) {

    <aside className="sidebar">
      <div className="sidebar-section">
        <div className="sidebar-section-label">
          <span>Recent traces</span>
          <span className="mono">{window.TRACES.length}</span>

        {window.TRACES.map((t) => (

            key={t.id}

            onClick={() => onSelect(t.id)}

              <span className={`trace-status ${t.status}`} />
              <span className="trace-title">{t.title}</span>
            </div>
            <div className="trace-meta">

              <span>·</span>

        ))}
      </div>
      <div className="sidebar-section">
        <div className="sidebar-section-label"><span>Saved experiments</span><span className="mono">3</span></div>
        <div className="trace-item">
          <div className="trace-title">Cheap model sweep</div>
          <div className="trace-meta"><span className="mono">haiku / gpt-5-mini</span></div>
        </div>
        <div className="trace-item">
          <div className="trace-title">Prompt A/B: planner v2</div>
          <div className="trace-meta"><span className="mono">2 branches</span></div>
        </div>
        <div className="trace-item">

      <div className="sidebar-section">
        <div className="sidebar-section-label"><span>Metrics (24h)</span></div>
        <div className="kv"><div className="kv-k">runs</div><div className="kv-v mono">42</div></div>
        <div className="kv"><div className="kv-k">spend</div><div className="kv-v mono">$31.07</div></div>
        <div className="kv"><div className="kv-k">avg lat</div><div className="kv-v mono">2.8s</div></div>
        <div className="kv"><div className="kv-k">success</div><div className="kv-v mono">94%</div></div>

}

function Tweaks({ state, set }) {
  const setKey = (k, v) => {
    set({ ...state, [k]: v });
    try {
      window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*");
    } catch {}
  };
  return (
    <div className="tweaks">
      <div className="tweaks-head">
        <span>TWEAKS</span>
        <button className="icon-btn-sm" onClick={() => set({ ...state, showTweaks: false })}>✕</button>
      </div>
      <div className="tweaks-body">
        <div className="tweak-row">
          <div className="tweak-label">theme</div>
          <div className="tweak-opts">
            {["default", "ink", "paper"].map((v) => (
              <button key={v} className={`tweak-opt ${state.variant === v ? "is-on" : ""}`} onClick={() => setKey("variant", v)}>{v}</button>
            ))}
          </div>
        </div>
        <div className="tweak-row">
          <div className="tweak-label">tree style</div>
          <div className="tweak-opts">
            {["classic", "dense", "timeline"].map((v) => (
              <button key={v} className={`tweak-opt ${state.treeStyle === v ? "is-on" : ""}`} onClick={() => setKey("treeStyle", v)}>{v}</button>
            ))}
          </div>
        </div>
        <div className="tweak-row">
          <div className="tweak-label">density</div>
          <div className="tweak-opts">
            {["dense", "comfortable"].map((v) => (
              <button key={v} className={`tweak-opt ${state.density === v ? "is-on" : ""}`} onClick={() => setKey("density", v)}>{v}</button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [activeTrace, setActiveTrace] = useS("trc_9f2a");
  const [selectedNode, setSelectedNode] = useS(
    localStorage.getItem("selNode") || "n4"
  );
  const [branchOpen, setBranchOpen] = useS(false);
  const [showBranches, setShowBranches] = useS(true);
  const [tweaks, setTweaks] = useS(TWEAK_DEFAULTS);
  const [view, setView] = useS(localStorage.getItem("view") || "trace");

  useE(() => { localStorage.setItem("selNode", selectedNode); }, [selectedNode]);
  useE(() => { localStorage.setItem("view", view); }, [view]);

  // Edit mode protocol
  useE(() => {
    const handler = (e) => {
      const d = e.data || {};
      if (d.type === "__activate_edit_mode") setTweaks((t) => ({ ...t, showTweaks: true }));
      if (d.type === "__deactivate_edit_mode") setTweaks((t) => ({ ...t, showTweaks: false }));
    };
    window.addEventListener("message", handler);
    try { window.parent.postMessage({ type: "__edit_mode_available" }, "*"); } catch {}
    return () => window.removeEventListener("message", handler);
  }, []);

  const trace = window.TRACES.find((t) => t.id === activeTrace);
  const node = window.NODES.find((n) => n.id === selectedNode);

  return (
    <div className="app" data-variant={tweaks.variant} data-density={tweaks.density}>
      <TopBar trace={trace} view={view} onView={setView} />
      <div className="workspace">
        <Sidebar activeTrace={activeTrace} onSelect={setActiveTrace} />
        {view === "trace" && (
          <div className={`main-area ${branchOpen ? "with-branch" : "no-branch"}`}>
            <TreePanel
              selected={selectedNode}
              onSelect={setSelectedNode}
              showBranches={showBranches}
              onToggleBranches={() => setShowBranches((v) => !v)}
              variant={tweaks.treeStyle}
            />
            <NodeDetail
              node={node}
              onBranch={() => setBranchOpen((v) => !v)}
              branchOpen={branchOpen}
              allNodes={window.NODES}
            />
            {branchOpen && (
              <BranchPanel
                node={node}
                allNodes={window.NODES}
                onClose={() => setBranchOpen(false)}
                onSubmit={() => { setBranchOpen(false); alert("Branch queued — it would appear as a new node in the tree."); }}
              />
            )}
          </div>
        )}
        {view === "wiki" && <div className="main-area view-wrap"><WikiView /></div>}
        {view === "code" && <div className="main-area view-wrap"><CodeGraphView /></div>}
      </div>
      {tweaks.showTweaks && <Tweaks state={tweaks} set={setTweaks} />}
    </div>
  );
}

// The TreePanel I wrote wraps itself in a .tree-panel div — override the outer wrapper.
// Simpler: patch — render TreePanel directly, since it already provides its own .tree-panel.
// So adjust App: remove outer div wrapper.
window.__app_root = ReactDOM.createRoot(document.getElementById("root"));
window.__app_root.render(<App />);
</script>
</body></html>
