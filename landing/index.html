<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lume — Private coding model on your laptop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
/>
<link rel="stylesheet" href="styles/tokens.css" />

<style>
  html, body {
    background: #0a0a0a;
    margin: 0;
    color: #f5f5f4;
    font-family: "Inter Tight", system-ui, sans-serif;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components/v1-parts-a.jsx"></script>
<script type="text/babel" src="components/v1-parts-b.jsx"></script>
<script type="text/babel" src="components/v2-landing.jsx"></script>
<script type="text/babel" src="components/v4-landing.jsx"></script>
<script type="text/babel" src="components/v5-landing.jsx"></script>
<script type="text/babel" src="components/waitlist-modal.jsx"></script>

<script type="text/babel" data-presets="react">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "variant": "broadsheet",
    "accent": "#a78bfa"
  }/*EDITMODE-END*/;

  const VARIANTS = {
    editorial: { label: "Editorial", desc: "Manifesto", Component: window.LandingV2 },
    broadsheet: { label: "Broadsheet", desc: "Newspaper", Component: window.LandingV4 },
    swiss: { label: "Swiss", desc: "Grid / minimal", Component: window.LandingV5 },
  };

  const App = () => {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const Picked = (VARIANTS[t.variant] || VARIANTS.editorial).Component;

    React.useEffect(() => {
      document.documentElement.style.setProperty("--acid", t.accent);
      // also derive the dim + glow tones from the accent
      document.documentElement.style.setProperty("--acid-glow", t.accent + "26");
    }, [t.accent]);

    return (
      <React.Fragment>
        <Picked />
        <WaitlistHost />
        <TweaksPanel title="Tweaks">
          <TweakSection label="Direction" />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6, marginBottom: 4 }}>
            {Object.entries(VARIANTS).map(([k, v]) => {
              const active = t.variant === k;
              return (
                <button
                  key={k}
                  onClick={() => setTweak("variant", k)}
                  style={{
                    border: active ? "1px solid #29261b" : ".5px solid rgba(0,0,0,.12)",
                    background: active ? "#29261b" : "rgba(255,255,255,.6)",
                    color: active ? "#fff" : "#29261b",
                    borderRadius: 7,
                    padding: "8px 6px",
                    cursor: "pointer",
                    fontFamily: "inherit",
                    textAlign: "center",
                    display: "flex", flexDirection: "column", gap: 2,
                  }}
                >
                  <span style={{ fontSize: 11, fontWeight: 600 }}>{v.label}</span>
                  <span style={{ fontSize: 9.5, opacity: 0.7 }}>{v.desc}</span>
                </button>
              );
            })}
          </div>

          <TweakSection label="Accent" />
          <TweakColor
            label="Highlight color"
            value={t.accent}
            onChange={(v) => setTweak("accent", v)}
          />
          <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
            {[
              ["#d4ff3a", "Acid"],
              ["#ff6b35", "Ember"],
              ["#7dd3fc", "Sky"],
              ["#f5f5f4", "Bone"],
              ["#a78bfa", "Iris"],
            ].map(([color, name]) => (
              <button
                key={color}
                onClick={() => setTweak("accent", color)}
                title={name}
                style={{
                  width: 28, height: 28,
                  borderRadius: 6,
                  border: t.accent.toLowerCase() === color.toLowerCase()
                    ? "1.5px solid #29261b"
                    : ".5px solid rgba(0,0,0,.15)",
                  background: color,
                  cursor: "pointer",
                  padding: 0,
                }}
              />
            ))}
          </div>
        </TweaksPanel>
      </React.Fragment>
    );
  };

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
