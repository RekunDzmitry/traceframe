services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: traceframe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traceframe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceframe}
      POSTGRES_DB: ${POSTGRES_DB:-traceframe}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ingest/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traceframe} -d ${POSTGRES_DB:-traceframe}"]
      interval: 5s
      timeout: 2s
      retries: 5

  ingest:
    build: ./ingest
    container_name: traceframe-ingest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      TRACEFRAME_API_KEY: ${TRACEFRAME_API_KEY}
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-traceframe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceframe}
      POSTGRES_DB: ${POSTGRES_DB:-traceframe}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENCODE_GO_MODEL: ${OPENCODE_GO_MODEL:-deepseek-v4-flash}
    depends_on:
      postgres:
        condition: service_healthy
    # Mount the host home read-only at the same path so the codegraph indexer
    # can resolve absolute host paths (e.g. /Users/<you>/github/<repo>) the
    # same way the CLI sees them. Read-only — indexer only reads source files.
    # The hf-cache volume holds the downloaded sentence-embedding model
    # (Xenova/all-MiniLM-L6-v2 ~25 MB) so rebuilds don't re-download it.
    volumes:
      - ${HOME}:${HOME}:ro
      - hf-cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 10s
      timeout: 2s
      retries: 3

volumes:
  pgdata:
  hf-cache:
