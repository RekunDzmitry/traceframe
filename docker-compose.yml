services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: traceframe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traceframe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceframe}
      POSTGRES_DB: ${POSTGRES_DB:-traceframe}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ingest/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./ingest/02-memory-embeddings.sql:/docker-entrypoint-initdb.d/02-memory-embeddings.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traceframe} -d ${POSTGRES_DB:-traceframe}"]
      interval: 5s
      timeout: 2s
      retries: 5

  ingest:
    build: ./ingest
    container_name: traceframe-ingest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      TRACEFRAME_API_KEY: ${TRACEFRAME_API_KEY}
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-traceframe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceframe}
      POSTGRES_DB: ${POSTGRES_DB:-traceframe}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENCODE_GO_MODEL: ${OPENCODE_GO_MODEL:-deepseek-v4-flash}
    depends_on:
      postgres:
        condition: service_healthy
    # Mount ~/github read-only at the same path so the codegraph indexer can
    # resolve absolute host paths (e.g. /Users/<you>/github/<repo>) the same
    # way the CLI sees them. Scoped to ~/github (not $HOME) to avoid macOS
    # TCC prompts for Documents/Downloads/Desktop/iCloud. Add additional
    # narrow mounts here if you need to index repos outside ~/github.
    # The hf-cache volume holds the downloaded sentence-embedding model
    # (Xenova/all-MiniLM-L6-v2 ~25 MB) so rebuilds don't re-download it.
    volumes:
      - ${HOME}/github:${HOME}/github:ro
      - hf-cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/healthz"]
      interval: 10s
      timeout: 2s
      retries: 3

  memory:
    build: ./memory
    container_name: traceframe-memory
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      TRACEFRAME_API_KEY: ${TRACEFRAME_API_KEY}
      PORT: 4001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-traceframe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceframe}
      POSTGRES_DB: ${POSTGRES_DB:-traceframe}
      INGEST_SERVICE_URL: http://ingest:4000
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-100}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/healthz"]
      interval: 10s
      timeout: 2s
      retries: 3

volumes:
  pgdata:
  hf-cache:
