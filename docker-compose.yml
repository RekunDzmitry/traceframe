services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: traceframe-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: traceframe
      CLICKHOUSE_PASSWORD: traceframe
    ports:
      - "8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 2s
      retries: 20

  app:
    build: .
    container_name: traceframe-app
    restart: unless-stopped
    environment:
      PORT: "4000"
      CLICKHOUSE_URL: http://traceframe:traceframe@clickhouse:8123
      TRACEFRAME_TRANSCRIPT_ROOT: ${HOME}/.codex/sessions
      TRACEFRAME_CLAUDE_TRANSCRIPT_ROOT: ${HOME}/.claude/projects
    ports:
      - "4000:4000"
    volumes:
      - ${HOME}/.codex/sessions:${HOME}/.codex/sessions:ro
      - ${HOME}/.claude/projects:${HOME}/.claude/projects:ro
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
