services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: traceframe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traceframe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceframe}
      POSTGRES_DB: ${POSTGRES_DB:-traceframe}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-init schema bootstrap. The service also runs this idempotently on
      # startup, so an existing pgdata volume with memories is left untouched.
      - ./service/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traceframe} -d ${POSTGRES_DB:-traceframe}"]
      interval: 5s
      timeout: 2s
      retries: 5

  service:
    build: ./service
    container_name: traceframe-memory
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      TRACEFRAME_API_KEY: ${TRACEFRAME_API_KEY}
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-traceframe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceframe}
      POSTGRES_DB: ${POSTGRES_DB:-traceframe}
    depends_on:
      postgres:
        condition: service_healthy
    # hf-cache holds the local embedding model (Xenova/all-MiniLM-L6-v2 ~25 MB)
    # so rebuilds don't re-download it.
    volumes:
      - hf-cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/healthz"]
      interval: 10s
      timeout: 2s
      retries: 3

volumes:
  pgdata:
  hf-cache:
